[package]
name = "clap-noun-verb-any"
version = "26.8.22"
edition = "2021"
rust-version = "1.74"
license = "MIT OR Apache-2.0"
authors = ["Sean Chatman <seanchatmangpt@gmail.com>"]
repository = "https://github.com/seanchatmangpt/clap-noun-verb"
documentation = "https://docs.rs/clap-noun-verb-any"
homepage = "https://github.com/seanchatmangpt/clap-noun-verb"
description = "Wrap any executable as a clap-noun-verb deployable CLI, with OCEL parity"
keywords = ["clap", "mcp", "cli", "process", "adapter"]
categories = ["command-line-utilities", "development-tools"]
readme = "README.md"
# `playground/autofde-lab` is a git submodule (a real, independently-maintained
# ~multi-GB Python/C++ monorepo) checked in for local example/demo purposes
# only -- it must never be packaged into a crates.io upload. `examples/` and
# `tests/` ARE included (cargo includes them by default; they're small).
exclude = ["playground/"]

[workspace]

[dependencies]
clap-noun-verb = { path = "..", version = "26.8.22" }
clap-noun-verb-deploy = { path = "../clap-noun-verb-deploy", version = "26.8.22" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"

[[bin]]
name = "cnv-any"
path = "src/bin/cnv-any.rs"

[[example]]
name = "serve"
path = "examples/autofde_lab_planners/serve.rs"
