macro_api:
  main_macros:
    - name: "#[verb(...)]"
      purpose: "Register a function as a CLI verb command"
      status: "stable"
      auto_discovery: "Yes (via linkme distributed slices)"
      compile_time_validation: "Yes"

    - name: "#[noun(...)]"
      purpose: "Register a struct as a CLI noun (command group)"
      status: "deprecated or no-op (per macro code comments)"
      note: "Verify in validation.rs for actual behavior"

    - name: "#[arg(...)]"
      purpose: "Mark function parameters with CLI argument metadata"
      status: "stable"
      note: "Only valid on parameters within #[verb] functions"

    - name: "#[meta_aware]"
      purpose: "Generate RDF introspection methods"
      status: "frontier (frontier features)"
      requires_feature: "meta-framework (likely)"

    - name: "#[declare_span(...)]"
      purpose: "Declare telemetry spans for compile-time validation"
      status: "frontier"
      requires_feature: "autonomic (likely)"

core_traits:
  traits_defined_in_verb_rs:
    - name: "VerbCommand"
      methods:
        - "execute(args: &VerbArgs) -> Result<T>"
      async_in_trait: false
      dyn_compatible: true
      note: "No async methods in trait (sync only)"

    - name: "VerbContext"
      fields:
        - "verb: String"
        - "noun: Option<String>"
        - "data: HashMap<String, String>"
        - "extensions: TypeMap (for typed dependency injection)"
      purpose: "Context passed to verb commands at runtime"

    - name: "VerbArgs"
      fields:
        - "matches: ArgMatches (from clap)"
        - "parent_matches: Option<ArgMatches>"
        - "context: VerbContext"
      purpose: "Arguments and metadata passed to verb handlers"

  traits_defined_in_noun_rs:
    - name: "NounCommand"
      purpose: "Base trait for noun (command group) implementations"
      note: "Verify actual methods in src/noun.rs"

