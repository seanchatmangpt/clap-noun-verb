# clap-noun-verb v26.6.1 Macro Surface Ledger
# Definitive inventory of all proc macros exported by the crate
#
# Convention:
# - LIVE_V2661: Macro is active in v26.6.1 and fully functional
# - DEPRECATED_V2661: Marked with #[deprecated] but still works (emits deprecation warning)
# - REMOVED: Deleted from codebase; code referencing it will not compile
# - HISTORICAL_ONLY: Documented but not exported (internal use only)
# - FRONTIER: Experimental feature-gated or unstable macro

macros:

  # ============================================================================
  # CORE: Noun/Verb Registration (foundational layer)
  # ============================================================================

  - name: "#[noun(...)]"
    kind: "proc_macro_attribute"
    macro_type: "attribute"
    status: "DEPRECATED_V2661"
    version_added: "< 1.0"
    version_deprecated: "5.6.0"
    feature_gate: "none (always available)"
    deprecation_note: |
      Nouns are now auto-detected from filename and module doc comments (//!).
      This macro is a no-op that emits a deprecation warning.
      Remove #[noun(...)] from your code; it is not needed.
    input_shape: |
      #[noun("noun_name")]
      #[noun("noun_name", "description")]
      fn your_function() {}
    emitted_shape: |
      Function definition with deprecation attribute added.
      Generates compile warning: "#[noun] is no longer needed — nouns are auto-detected..."
    example_usage: |
      // OLD (deprecated):
      #[noun("services", "Manage services")]
      fn show_status() -> Result<Status> { ... }

      // NEW (remove #[noun]):
      /// Manage services
      fn show_status() -> Result<Status> { ... }
    test_evidence: "tests/integration.rs (integration tests run against deprecated macro)"
    behavior: "Pass-through with deprecation warning; removes #[noun] from output"

  - name: "#[verb(...)]"
    kind: "proc_macro_attribute"
    macro_type: "attribute"
    status: "LIVE_V2661"
    version_added: "1.0"
    version_current: "26.6.1"
    feature_gate: "none (always available)"
    input_shape: |
      #[verb("verb_name")]
      #[verb("verb_name", "noun_name")]
      #[verb("verb_name", "noun_name", "description")]
      fn function_name(
          #[arg(short = 's', ...)] param: Type,
      ) -> Result<OutputType> { ... }
    emitted_shape: |
      Original function definition (with #[noun] removed)
      + Duplicate verb detection code (GAP 2)
      + Wrapper function (__function_name_wrapper)
      + Distributed slice registration (__init_function_name)
      All returned as TokenStream for registration via linkme
    compile_time_validation:
      - "GAP 1 (Forgotten #[verb]): Compile-fail detect if handler not wrapped"
      - "GAP 2 (Duplicate verbs): Generates duplicate detection at compile time"
      - "GAP 3 (Return type Serialize): Validates via #[non_existent_type] reference"
      - "GAP 4 (Attribute syntax): Helpful error messages for malformed attributes"
      - "Verb complexity check (POKA-YOKE FM-1.1): Prevents business logic in verb layer"
      - "CLI type detection (POKA-YOKE FM-1.2): Rejects CLI types in parameters"
    feature_gate: "none (always available)"
    example_usage: |
      #[verb("status")]
      fn show_status(
          #[arg(short = 'v')]
          verbose: bool,
      ) -> Result<Status> {
          Ok(Status { active: true })
      }
    test_evidence: |
      tests/arg_actions.rs
      tests/integration.rs
      tests/compile_time_validation.rs
      Comprehensive integration tests covering:
      - Positional and named arguments
      - Flags (bool types)
      - Count actions (usize types)
      - Multiple values (Vec<T>)
      - Options with defaults
    behavior: |
      Registers verb in linkme distributed slice for auto-discovery.
      Generates wrapper for type-safe argument extraction and handler invocation.
      Auto-infers noun from filename; allows explicit override.
      Strips #[arg] and #[validate] attributes from parameters in output.

  # ============================================================================
  # ARG ANNOTATION: Parameter attributes
  # ============================================================================

  - name: "#[arg(...)]"
    kind: "proc_macro_attribute (parameter)"
    macro_type: "attribute on function parameters"
    status: "LIVE_V2661"
    version_added: "2.0"
    version_current: "26.6.1"
    feature_gate: "none"
    note: |
      This is NOT a real proc_macro on parameters (Rust doesn't support that).
      Instead, it is a proc_macro_attribute that errors when misused on items.
      The #[verb] macro extracts #[arg(...)] attributes directly from raw parameter tokens.
    input_shape: |
      Within #[verb] functions only:
      #[arg(short = 'v')]
      #[arg(long = "verbose")]
      #[arg(short = 'p', default_value = "8080")]
      #[arg(env = "PORT", default_value = "8080")]
      #[arg(value_name = "FILE")]
      #[arg(index = 0)]  // positional
      #[arg(action = "count")]
      #[arg(action = "set_false")]
      #[arg(help = "Custom help")]
      #[arg(long_help = "Detailed help")]
      #[arg(group = "format")]
      #[arg(requires = ["other_arg"])]
      #[arg(conflicts_with = ["other_arg"])]
      #[arg(multiple)]
      #[arg(next_line_help)]
      #[arg(value_parser = some_expression)]
      #[arg(aliases = ["v", "verb"])]
      #[arg(exclusive = true)]
      param: Type
    emitted_shape: |
      If applied to an item: compile error
      If applied to parameter in #[verb]: parsed and consumed by #[verb] macro
      No output; attributes are strip from final function.
    misuse_error: |
      "#[arg(...)] cannot be applied to items directly.
       It should only be used on function parameters within a #[verb] function."
    example_usage: |
      #[verb("deploy")]
      fn deploy(
          #[arg(short = 'e', long = "environment")]
          env: String,

          #[arg(short = 'v')]
          verbose: bool,

          #[arg(default_value = "8080")]
          port: u16,

          #[arg(env = "CONFIG")]
          config: Option<String>,
      ) -> Result<DeployResult> { ... }
    test_evidence: "tests/arg_actions.rs, tests/integration.rs"
    behavior: |
      Parsed by #[verb] macro for each parameter.
      Supports all common clap argument types (short, long, default, env, etc.).
      Handles multiple, flags, options, and positional arguments.
      Integrates with doc comment relationship tags: [group:], [requires:], [conflicts:], etc.

  - name: "#[validate(...)]"
    kind: "proc_macro_attribute (parameter)"
    macro_type: "attribute on function parameters"
    status: "LIVE_V2661"
    version_added: "3.0"
    version_current: "26.6.1"
    feature_gate: "none"
    input_shape: |
      #[validate(min = 0, max = 100)]
      #[validate(min_length = 1, max_length = 50)]
      #[validate(min = "0", max = "255")]
      param: Type
    emitted_shape: |
      Parsed by #[verb] macro; stripped from final parameter.
      Constraints combined with type-inferred validation.
    example_usage: |
      #[verb("process")]
      fn process(
          #[arg(short = 'c')]
          #[validate(min = 1, max = 100)]
          count: u32,
      ) -> Result<ProcessResult> { ... }
    behavior: |
      Extracted by #[verb] macro during argument metadata generation.
      Merged with auto-inferred constraints from type (e.g., u8 infers max=255).
      Explicit #[validate] overrides type-inferred constraints.

