      Enables meta-level capability reflection for agent systems.

  # ============================================================================
  # TELEMETRY & SPAN INSTRUMENTATION (Frontier)
  # ============================================================================

  - name: "declare_span!(...)"
    kind: "proc_macro"
    macro_type: "function-like macro"
    status: "LIVE_V2661"
    version_added: "5.1"
    version_current: "26.6.1"
    feature_gate: "none"
    purpose: "Declare a compile-time validated telemetry span constant"
    input_shape: |
      declare_span!(SPAN_NAME, "span_name");
    emitted_shape: |
      Static span constant: const SPAN_NAME: &'static str = "span_name";
      Distributed slice registration for compile-time validation
    example_usage: |
      declare_span!(PROCESS_REQUEST, "process_request");

      // Use must follow or compilation fails
      span!(PROCESS_REQUEST, { /* work */ })
    test_evidence: "tests/unit.rs (telemetry tests)"
    behavior: |
      Registers span in __SPAN_REGISTRY distributed slice.
      Requires span usage via span!(...) macro in same module.
      Compile-time validation prevents unused spans.
      NOTE: telemetry removed in recent versions (no-op behavior).

  - name: "span!(...)"
    kind: "proc_macro"
    macro_type: "function-like macro"
    status: "LIVE_V2661"
    version_added: "5.1"
    version_current: "26.6.1"
    feature_gate: "none"
    purpose: "Instrument a code block with telemetry span wrapping"
    input_shape: |
      span!(SPAN_CONST, { /* block */ })
    emitted_shape: |
      Wrapped block expression with instrumentation code
      (actual telemetry removed; macro acts as transparent passthrough)
    example_usage: |
      declare_span!(PROCESS_DATA, "process_data");

      fn process() -> Result<Data> {
          span!(PROCESS_DATA, {
              Ok(Data::new())
          })
      }
    behavior: |
      Wraps code block with span context.
      Returns the block result unchanged.
      Registers usage in distributed slice for declare_span! validation.
      NOTE: telemetry instrumentation removed (no-op); kept for compatibility.

