# clap-noun-verb v26.6.1: Command Grammar Dispatch Mechanisms
# ============================================================
# Research artifact mapping actual command patterns to implementation details

command_grammar:
  framework_name: "clap-noun-verb"
  version: "26.6.1"
  released: "2024-2025"

  # DISCOVERY: Terminology is DECLARATIVE, not necessarily literal
  # ---------
  # The crate uses "noun" and "verb" as **trait names** and **concept labels**,
  # not as reserved keywords or language-level features. This is critical.
  # The terms are applied **by developer choice**, not imposed by the system.

  terminology:
    noun:
      definition: "A trait-based command grouping (e.g., 'services', 'collector', 'config')"
      implementation_point: "src/noun.rs - trait NounCommand"
      is_literal: false
      note: "Developers name their groupings; system makes no assumptions"

    verb:
      definition: "A trait-based action or operation (e.g., 'status', 'logs', 'restart')"
      implementation_point: "src/verb.rs - trait VerbCommand"
      is_literal: false
      note: "Developers name their actions; system makes no assumptions"

# ============================================================
# ACTUAL COMMAND GRAMMAR MECHANISMS (Evidence-Based)
# ============================================================

dispatch_mechanisms:

  # MECHANISM 1: Trait-Based Dispatch (PRIMARY)
  # -------------------------------------------
  mechanism_1_trait_dispatch:
    classification: "TRAIT_BASED"
    description: "Commands are registered and dispatched via Rust trait implementations"

    nouns:
      trait_name: "NounCommand"
      file: "src/noun.rs:77"
      methods:
        - "name() -> &'static str"
        - "about() -> &'static str"
        - "verbs() -> Vec<Box<dyn VerbCommand>>"
        - "sub_nouns() -> Vec<Box<dyn NounCommand>>"
        - "build_command() -> Command"
        - "handle_verb(verb_name, args) -> Result<()>"
        - "handle_sub_noun(sub_noun_name, args) -> Result<()>"
      memory_model: "Boxed trait objects stored in HashMap<String, Box<dyn NounCommand>>"
      lifecycle: "Runtime registration via CommandRegistry::register_noun()"

    verbs:
      trait_name: "VerbCommand"
      file: "src/verb.rs:469"
      methods:
        - "name() -> &'static str"
        - "about() -> &'static str"
        - "run(&VerbArgs) -> Result<()>"
        - "build_command() -> Command"
        - "additional_args() -> Vec<clap::Arg>"
      memory_model: "Boxed trait objects stored in HashMap<String, Box<dyn VerbCommand>>"
      dispatch_flow: |
        1. VerbCommand::run() receives VerbArgs containing clap::ArgMatches
        2. Handler extracts arguments via VerbArgs::get_one(), get_many(), get_flag()
        3. Handler executes business logic and returns Result<()>

  # MECHANISM 2: Auto-Discovery via Linkme (REGISTRATION BACKEND)
  # ---------------------------------------------------------------
  mechanism_2_linkme_discovery:
    classification: "REGISTRY_MECHANISM"
    description: "Compile-time command discovery via linkme distributed slices"

    implementation:
      file: "src/cli/registry.rs:160-168"
      distributed_slices:
        nouns:
          name: "__NOUN_REGISTRY"
          type: "static [fn()]"
          purpose: "Collect noun registration functions generated by #[noun] macro"
          invocation_point: "CommandRegistry::init() at line 270"
        verbs:
          name: "__VERB_REGISTRY"
          type: "static [fn()]"
          purpose: "Collect verb registration functions generated by #[verb] macro"
          invocation_point: "CommandRegistry::init() at line 273"

    registration_flow: |
      Compile-time:
        1. #[verb] macro (in clap-noun-verb-macros) generates registration function
        2. #[linkme::distributed_slice] emits function pointer into __VERB_REGISTRY slice
        3. linkme collects all pointers at link time

      Runtime (CommandRegistry::init):
        1. OnceLock ensures single initialization
        2. Iterate __NOUN_REGISTRY, call each registration function
        3. Iterate __VERB_REGISTRY, call each registration function
        4. Functions populate REGISTRY (Mutex<CommandRegistry>)

  # MECHANISM 3: Builder Pattern (PUBLIC API)
  # -------------------------------------------
  mechanism_3_builder_pattern:
    classification: "BUILDER_BASED"
    description: "Fluent API for constructing CLI from trait objects"

    primary_class: "CliBuilder"
    file: "src/builder.rs:14-136"

    api_flow: |
      CliBuilder::new()
        .name("myapp")
        .about("Description")
        .noun(noun_trait_object)
        .noun(another_noun_trait_object)
        .run()

    underlying_registry: "CommandRegistry"
    file: "src/registry.rs:23-456"

    registry_storage:
      nouns: "HashMap<String, Box<dyn NounCommand>>"
      source: "Registered via .noun() or .register_noun()"

    execution_entry: "CommandRegistry::route(ArgMatches)"
    file: "src/registry.rs:304-363"

  # MECHANISM 4: Clap Integration (PARSING LAYER)
  # -----------------------------------------------
  mechanism_4_clap_integration:
    classification: "CLAP_NATIVE_WRAPPER"
    description: "clap parses CLI args; clap-noun-verb dispatches to handlers"

    command_tree_building:
      function: "CommandRegistry::build_command()"
      file: "src/registry.rs:254-301"
      flow: |
        1. For each noun in HashMap:
           - Call noun.build_command() -> clap::Command
           - build_command() adds noun as subcommand with all its verbs
        2. Return root clap::Command with all nouns as subcommands

    argument_parsing:
      library: "clap"
      mechanism: "clap::Command::try_get_matches_from(args)"
      output: "clap::ArgMatches tree"
      file: "src/registry.rs:372-449"

    dispatch_after_parsing:
      function: "CommandRegistry::route(ArgMatches)"
      file: "src/registry.rs:304-363"
      algorithm: |
        route(matches):
          (noun_name, noun_matches) = matches.subcommand()
          noun = registry.get_noun(noun_name)
          route_recursive(noun, noun_name, noun_matches, root_matches)

        route_recursive(noun, noun_name, matches, root_matches):
          if matches.has_subcommand():
            (sub_name, sub_matches) = matches.subcommand()
            if verb = noun.verbs.find(sub_name):
              verb.run(VerbArgs::new(sub_matches).with_parent(root_matches))
            elif sub_noun = noun.sub_nouns.find(sub_name):
              route_recursive(sub_noun, sub_name, sub_matches, root_matches)
          else:
            noun.handle_direct(VerbArgs)

  # MECHANISM 5: Macro-Based Code Generation
  # ------------------------------------------
  mechanism_5_macro_generation:
    classification: "MACRO_BASED"
    description: "Attribute macros generate registration glue code"

    noun_macro:
      name: "#[noun]"
      file: "clap-noun-verb-macros/src/lib.rs:286"
      status: "DEPRECATED (v5.6.0+)"
      behavior: "No-op with deprecation warning"
      reason: "Nouns now auto-detected from filename and module doc comments"

    verb_macro:
      name: "#[verb]"
      file: "clap-noun-verb-macros/src/lib.rs:331"
      status: "PRIMARY REGISTRATION MECHANISM"

      generates: |
        1. Validation (compile-time):
           - Return type implements Serialize
           - Attribute syntax correct
           - No duplicate verbs
           - Verb function complexity validation

        2. Registration function (emitted to __VERB_REGISTRY):
           - Calls CommandRegistry::register_verb_with_args()
           - Passes: noun_name, verb_name, about, args, handler_closure

        3. Handler closure:
           - Wraps original function
           - Converts HandlerInput to function parameters
           - Serializes return value to HandlerOutput

      macro_file: "clap-noun-verb-macros/src/lib.rs:331-449"

    arg_macro:
      name: "#[arg(...)]"
      usage_location: "Function parameters in #[verb] functions"
      behavior: "Parsed by #[verb] macro, not a standalone proc_macro_attribute"
      properties_parsed:
        - "env: Environment variable name"
        - "default_value: Default argument value"
        - "help: Help text"
        - "short: Short flag (-x)"
        - "long: Long flag (--flag)"
        - "value_name: Help text placeholder (FILE, PORT)"
        - "value_parser: Type parser expression"
        - "min/max: Range validators"
        - "requires/conflicts_with: Argument relationships"

# ============================================================
# ARGUMENT HANDLING
# ============================================================

argument_modeling:

  # Storage & Representation
  metadata_storage:
    structure: "ArgMetadata"
    file: "src/cli/registry.rs:192-246"
    fields:
      - name: String
      - required: bool
      - is_flag: bool
      - help: Option<String>
      - min_value: Option<String>
      - max_value: Option<String>
      - min_length: Option<usize>
      - max_length: Option<usize>
      - short: Option<char>
      - default_value: Option<String>
      - env: Option<String>
      - multiple: bool
      - value_name: Option<String>
      - aliases: Vec<String>
      - positional: Option<usize>
      - action: Option<clap::ArgAction>
      - group: Option<String>
      - requires: Vec<String>
      - conflicts_with: Vec<String>
      - value_parser: Option<String>
      - hide: bool
      - next_help_heading: Option<String>
      - long_help: Option<String>
      - next_line_help: bool
      - display_order: Option<usize>
      - exclusive: Option<bool>
      - trailing_vararg: bool
      - allow_negative_numbers: bool
      - value_hint: Option<String>
      - global: bool

  # Argument Access in Handlers
  verb_args_struct:
    type_name: "VerbArgs"
    file: "src/verb.rs:89-436"
    access_methods:
      typed_required: "get_one<T>(name) -> Result<T>"
      typed_optional: "get_one_opt<T>(name) -> Option<T>"
      typed_multiple: "get_many<T>(name) -> Result<Vec<T>>"
      string_required: "get_one_str(name) -> Result<String>"
      string_optional: "get_one_str_opt(name) -> Option<String>"
      string_multiple: "get_many_opt_str(name) -> Vec<String>"
      flags: "is_flag_set(name) -> bool"
      flag_count: "get_flag_count(name) -> u8"
      paths: "get_path(name) -> Result<PathBuf>"
      global_args: "get_global<T>(name), get_global_str(name), get_global_many<T>(name)"

    internal_representation: |
      pub struct VerbArgs {
        matches: ArgMatches,        // From clap parsing
        parent_matches: Option<ArgMatches>,  // For global args
        context: VerbContext,       // Metadata (noun, verb, extensions)
      }

# ============================================================
# OUTPUT SERIALIZATION
# ============================================================

output_formatting:

  default_format: "JSON"
  description: "All command output automatically serialized to JSON (agent-ready)"

  formatting_module: "src/format.rs"

  serialization_mechanism:
    requirement: "All handler return types must implement serde::Serialize"
    enforced_at: "Compile-time by #[verb] macro validation"

    handler_return_type: "Result<T> where T: Serialize"
    conversion: "Result<T> -> JSON string -> printed to stdout"

  output_customization:
    global_flags:
      - "--format json|yaml|toml|csv|tsv|html"
      - "--select <jsonpath|jmespath>"
        description: "Project/filter JSON output"

    structured_errors:
      flag: "--structured-errors"
      behavior: "Errors output as StructuredError JSON instead of plaintext"

  hook_system:
    function: "register_output_validation_hook()"
    file: "src/format.rs"
    purpose: "Allow custom validation/transformation of serialized output before emission"

# ============================================================
# ERROR & REFUSAL HANDLING
# ============================================================

error_handling:

  error_type: "NounVerbError"
  file: "src/error.rs"

  variants:
    - ArgumentError
    - InvalidStructure
    - CommandNotFound (with candidates suggestion)
    - VerbNotFound (with candidates suggestion)
    - ExecutionError
    - ValidationError

  error_propagation: |
    Handler return value: Result<T> (where Err(NounVerbError))
    -> Serialized as JSON error object
    -> Exit code 1

  command_not_found_handling:
    function: "command_not_found_with_candidates()"
    file: "src/error.rs"
    behavior: "Suggests similar command names based on registry state"

  validation_errors:
    compile_time: "Via #[verb] macro validation (Gap 1-4)"
    runtime: "Via NounVerbError return values"

# ============================================================
# HELP GENERATION
# ============================================================

help_generation:

  mechanism: "Clap's built-in help generation"

  text_sources:
    noun_about: "NounCommand::about()"
    verb_about: "VerbCommand::about()"
    arg_help: "ArgMetadata::help"
    arg_long_help: "ArgMetadata::long_help"
    function_docstring: "Extracted by #[verb] macro from doc comments"

  help_customization:
    methods:
      - "NounCommand::build_command() can override clap::Command"
      - "VerbCommand::build_command() can override clap::Command"
      - "VerbCommand::additional_args() can add extra help text"

    docstring_parsing: |
      #[verb] macro extracts function doc comments and:
      1. Extracts first line as verb about/help
      2. Parses # Arguments section for arg metadata
      3. Parses relationship tags like [required], [env: X], [default: Y]

  introspection_flag: "--introspect"
    behavior: "Emits JSON Schema array of all executable commands for LLM tool-calling"
    implementation: "collect_tools_from_cmd() in src/registry.rs:699"

# ============================================================
# COMMAND INTROSPECTION & LISTING
# ============================================================

introspection:

  runtime_query:
    function: "CommandRegistry::command_structure()"
    file: "src/registry.rs:179-188"
    returns: "HashMap<String, Vec<String>> (noun -> verbs)"

  llm_introspection:
    flag: "--introspect"
    output_type: "Vec<ToolDefinition> (JSON Schema compatible)"
    schema_types: "ToolDefinition, ToolParameters, PropertySchema"
    file: "src/registry.rs:669-781"

    json_schema_generation:
      function: "collect_tools_from_cmd(clap::Command, prefix)"
      file: "src/registry.rs:699"
      algorithm: |
        For each executable command (leaf node in command tree):
          Generate ToolDefinition {
            name: "noun_verb" format
            description: from clap::Command::about()
            parameters: {
              type: "object"
              properties: {
                arg_name: {
                  type: (string | boolean | array)
                  description: from ArgMetadata::help
                  default: ArgMetadata::default_value
                  items: (for arrays)
                }
              }
              required: [list of required arg names]
            }
          }

  programmatic_discovery:
    methods:
      - "registry.noun_names() -> Vec<&str>"
      - "registry.get_noun(name) -> Option<&dyn NounCommand>"
      - "registry.nouns() -> Vec<&dyn NounCommand>"
      - "registry.get_verbs(noun) -> Vec<(&str, &str)>"
      - "registry.has_noun(name) -> bool"
      - "registry.command_structure() -> HashMap"

# ============================================================
# CLASSIFICATION SUMMARY
# ============================================================

classification_matrix:

  "Command Grouping (Nouns)":
    mechanism: "NounCommand trait + HashMap registry"
    classification: "TRAIT_BASED"
    registration: "Manual via CliBuilder::noun() OR auto-discovery via linkme"
    nesting: "Sub-nouns supported (nested command groups)"

  "Action Selection (Verbs)":
    mechanism: "VerbCommand trait + HashMap registry"
    classification: "TRAIT_BASED"
    registration: "#[verb] macro -> linkme distributed slice -> CommandRegistry"
    dispatch: "CommandRegistry::route_recursive() traverses noun->verb tree"

  "Argument Modeling":
    mechanism: "ArgMetadata struct extracted from function signatures and #[arg] attributes"
    classification: "MACRO_BASED"
    representation: "Stored in Vec<ArgMetadata> attached to VerbMetadata"
    access: "VerbArgs provides type-safe extraction from clap::ArgMatches"

  "Registration Mechanism":
    primary: "linkme distributed slices (__VERB_REGISTRY, __NOUN_REGISTRY)"
    fallback: "Runtime registration via CommandRegistry::register_verb()"
    initialization: "OnceLock singleton ensures single init"
    classification: "REGISTRY_MECHANISM"

  "Output Serialization":
    mechanism: "serde::Serialize on return types"
    format_default: "JSON (agent-ready)"
    hooks: "Custom validation/transformation via output_validation_hook registry"
    classification: "GENERATED_TABLE"

  "Error/Refusal Handling":
    mechanism: "Result<T> return type + NounVerbError variants"
    suggestions: "Candidate-based suggestions for not-found errors"
    classification: "EXPLICIT_NOUN_VERB_API"

  "Help Generation":
    mechanism: "Clap's built-in + docstring extraction by #[verb] macro"
    introspection: "JSON Schema via --introspect flag"
    classification: "CLAP_NATIVE_WRAPPER"

  "Command Introspection":
    runtime_queries: "CommandRegistry methods (get_verbs, command_structure, etc.)"
    llm_introspection: "JSON Schema array via --introspect flag"
    classification: "EXPLICIT_NOUN_VERB_API"

# ============================================================
# CRITICAL FINDINGS
# ============================================================

key_insights:

  insight_1_terms_are_conventions:
    title: "Noun/Verb are Trait-Based Patterns, Not Language Features"
    evidence:
      - "NounCommand and VerbCommand are Rust traits, not keywords"
      - "Developers implement traits explicitly or via macros"
      - "No special language syntax; fully composable via trait objects"
    implication: "System is agnostic to command naming; 'noun' and 'verb' are just concepts applied by developers"

  insight_2_linkme_is_hidden:
    title: "linkme Distributed Slices are Internal Implementation Detail"
    evidence:
      - "Linked at compile time by linkme"
      - "Initialized once via CommandRegistry::init()"
      - "Public API never exposes linkme; only traits and registry"
    implication: "Developers never directly interact with linkme; it's macro-managed backend"

  insight_3_dispatch_is_recursive:
    title: "Dispatch Algorithm Handles Arbitrary Nesting"
    evidence:
      - "route_recursive() method in CommandRegistry"
      - "Supports noun -> verb, noun -> sub_noun -> verb, etc."
    implication: "No hard limit on command tree depth; limited only by clap's architecture"

  insight_4_serialization_mandatory:
    title: "JSON Serialization is Built-In, Not Optional"
    evidence:
      - "All handler return types must impl Serialize"
      - "Enforced at compile-time by #[verb] macro"
      - "Default output format is JSON (agent-ready)"
    implication: "Designed for LLM/agent consumption, not human-first CLI"

  insight_5_registration_can_be_dynamic:
    title: "Linkme Auto-Discovery + Runtime Registration Both Supported"
    evidence:
      - "__VERB_REGISTRY distributed slice"
      - "CommandRegistry::register_verb() public method"
      - "CliBuilder accepts trait objects (any registration source)"
    implication: "Flexible: can mix macro-generated + dynamically registered commands"

