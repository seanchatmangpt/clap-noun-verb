[package]
name = "unibit-cli"
version = "0.1.0"
edition = "2021"
authors = ["Sean Chatman <seanchatmangpt@gmail.com>"]

[dependencies]
clap-noun-verb = { path = ".." }
clap-noun-verb-macros = { path = "../clap-noun-verb-macros" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.40", features = ["full"] }
anyhow = "1.0"
thiserror = "1.0"
linkme = "0.3"
once_cell = "1.19"

# Unibit Kinetic Substrate Drivers
unibit-kernel = { path = "/Users/sac/unibit/crates/unibit-kernel" }
unibit-l1 = { path = "/Users/sac/unibit/crates/unibit-l1" }
unibit-powl64 = { path = "/Users/sac/unibit/crates/unibit-powl64" }
unibit-mustar = { path = "/Users/sac/unibit/crates/unibit-mustar" }
unibit-causality = { path = "/Users/sac/unibit/crates/unibit-causality" }
unibit-semantics = { path = "/Users/sac/unibit/crates/unibit-semantics" }
