name: Verify

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"
  RUST_STABLE: "1.97.1"
  RUST_MSRV: "1.74.0"
  GGEN_REPOSITORY: seanchatmangpt/ggen
  GGEN_SHA: 68952593c40214ac1a681073d65f3902a9cdfce4
  WASM4PM_REPOSITORY: seanchatmangpt/wasm4pm
  WASM4PM_SHA: f1d4d7ac8b2f9a0265be82991487766eb35b4675

jobs:
  verify:
    name: Exact-head verification
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Initialize exact-head evidence
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
        run: |
          set -euo pipefail
          mkdir -p target/ci/gates target/ci/witnesses
          jq -n \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg head_sha "$HEAD_SHA" \
            --arg base_sha "$BASE_SHA" \
            --arg event "$GITHUB_EVENT_NAME" \
            '{repository:$repository,base_sha:$base_sha,head_sha:$head_sha,event:$event,actuation_performed:false}' \
            > target/ci/IDENTITY.json
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            git diff --name-only "$BASE_SHA" "$HEAD_SHA" > target/ci/changed-paths.txt
          else
            git diff-tree --no-commit-id --name-only -r "$HEAD_SHA" > target/ci/changed-paths.txt
          fi
          if grep -Eq '^(AGENTS\.md|Cargo\.toml|ggen\.toml|package\.toml|ontology/|gates/|queries/|templates/|packs/|examples/greet-demo/|src/capability/|src/frontier\.rs|src/federation/|src/otel\.rs|scripts/verify_ggen_contract\.py|scripts/test_verify_ggen_contract\.py)' target/ci/changed-paths.txt; then
            echo true > target/ci/semantic-required.txt
          else
            echo false > target/ci/semantic-required.txt
          fi
          cat target/ci/changed-paths.txt
          printf 'semantic_required=%s\n' "$(cat target/ci/semantic-required.txt)"

      - name: Provision pinned stable Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: ${{ env.RUST_STABLE }}
          components: rustfmt, clippy

      - name: Reuse one Rust cache identity
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          key: verify-${{ env.RUST_STABLE }}
          cache-all-crates: false

      - name: Execute high-information core gates
        id: core
        run: |
          set -euo pipefail
          gate() {
            name="$1"
            shift
            echo "::group::$name"
            set +e
            "$@"
            code=$?
            set -e
            echo "$code" > "target/ci/gates/$name.exit"
            echo "gate=$name exit=$code"
            echo '::endgroup::'
            return 0
          }

          gate unfinished-work bash -lc '
            set -euo pipefail
            python3 -m py_compile scripts/verify_no_wip.py scripts/test_verify_no_wip.py
            python3 -m unittest scripts/test_verify_no_wip.py -v
            python3 scripts/verify_no_wip.py --report target/ci/wip-verifier-report.json
          '
          gate format cargo fmt --all -- --check
          gate clippy cargo clippy --workspace --all-targets --all-features -- -D warnings
          gate feature-closure bash -lc '
            set -euo pipefail
            cargo check -p clap-noun-verb --all-targets --no-default-features
            python3 - <<"PY"
          import subprocess, tomllib
          with open("Cargo.toml", "rb") as source:
              features = sorted(tomllib.load(source)["features"])
          for feature in features:
              print(f"feature={feature}", flush=True)
              subprocess.run([
                  "cargo", "check", "-p", "clap-noun-verb", "--all-targets",
                  "--no-default-features", "--features", feature,
              ], check=True)
          print(f"compiled_features={len(features)}")
          PY
            cargo check --workspace --all-targets --all-features
          '
          gate registry-unit cargo test -p clap-noun-verb --lib --all-features
          gate all-features cargo test --workspace --all-features
          gate witness-replay bash -lc '
            set -euo pipefail
            bash scripts/run_witnesses.sh target/ci/witnesses/first.txt
            bash scripts/run_witnesses.sh target/ci/witnesses/second.txt
            cmp target/ci/witnesses/first.txt target/ci/witnesses/second.txt
            sha256sum target/ci/witnesses/first.txt target/ci/witnesses/second.txt > target/ci/witnesses/sha256.txt
          '
          gate docs-benchmark bash -lc '
            set -euo pipefail
            RUSTDOCFLAGS="-D warnings" cargo doc --workspace --all-features --no-deps
            cargo bench -p clap-noun-verb --bench dispatch --all-features --no-run
          '

      - name: Install pinned cargo-deny
        uses: taiki-e/install-action@c505b76b536c2cff45f2b7d03fd8fcdb19103465
        with:
          tool: cargo-deny

      - name: Execute supply-chain gate
        run: |
          set +e
          cargo deny check advisories bans licenses sources --deny warnings
          code=$?
          set -e
          echo "$code" > target/ci/gates/supply-chain.exit
          echo "gate=supply-chain exit=$code"

      - name: Execute declared MSRV gate
        run: |
          set +e
          rustup toolchain install "$RUST_MSRV" --profile minimal --no-self-update
          install_code=$?
          if [ "$install_code" -eq 0 ]; then
            cargo +${RUST_MSRV} check -p clap-noun-verb -p clap-noun-verb-macros --all-features
            code=$?
          else
            code=$install_code
          fi
          set -e
          echo "$code" > target/ci/gates/msrv.exit
          echo "gate=msrv exit=$code"

      - name: Checkout pinned ggen authority
        id: ggen_checkout
        if: hashFiles('target/ci/semantic-required.txt') != '' && steps.core.outcome == 'success'
        continue-on-error: true
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: ${{ env.GGEN_REPOSITORY }}
          ref: ${{ env.GGEN_SHA }}
          path: .tooling/ggen
          fetch-depth: 1

      - name: Provision pinned ggen toolchain
        id: ggen_setup
        if: steps.ggen_checkout.outcome == 'success'
        continue-on-error: true
        uses: ./.tooling/ggen/.github/actions/setup-ggen-build

      - name: Execute semantic manufacture and replay gate
        id: semantic
        if: always()
        env:
          GGEN_CHECKOUT: ${{ steps.ggen_checkout.outcome }}
          GGEN_SETUP: ${{ steps.ggen_setup.outcome }}
        run: |
          set -euo pipefail
          required=$(cat target/ci/semantic-required.txt)
          if [ "$required" != true ]; then
            echo 0 > target/ci/gates/semantic.exit
            echo 'semantic gate not required for this diff'
            exit 0
          fi
          if [ "$GGEN_CHECKOUT" != success ] || [ "$GGEN_SETUP" != success ]; then
            echo 1 > target/ci/gates/semantic.exit
            echo "ggen authority unavailable: checkout=$GGEN_CHECKOUT setup=$GGEN_SETUP"
            exit 0
          fi

          set +e
          bash -lc '
            set -euo pipefail
            python3 -m py_compile scripts/verify_ggen_contract.py scripts/test_verify_ggen_contract.py
            python3 -m unittest scripts/test_verify_ggen_contract.py -v
            python3 scripts/verify_ggen_contract.py --json | tee target/ci/ggen-contract.json
            cargo build --manifest-path .tooling/ggen/Cargo.toml -p ggen-cli-lib --bin ggen
            GGEN="$GITHUB_WORKSPACE/.tooling/ggen/target/debug/ggen"

            "$GGEN" sync run
            "$GGEN" receipt verify

            (
              cd examples/greet-demo
              "$GGEN" sync run
              "$GGEN" receipt verify
              cargo check
              cargo test
              cargo run --quiet -- tool greet --name Sean | tee "$GITHUB_WORKSPACE/target/ci/greet-output.json"
            )
            grep -q Sean target/ci/greet-output.json

            (
              cd packs/clap-noun-verb-capability-pack
              "$GGEN" sync run
              "$GGEN" receipt verify
              jq -e '\''.admission == "ADMITTED" and .capabilities == 15 and .proof_surfaces == 45 and .actuation_performed == false'\'' VERIFIER_REPORT.json
              cargo test --manifest-path consumer/Cargo.toml
            )

            "$GGEN" sync run
            "$GGEN" receipt verify
            (cd examples/greet-demo && "$GGEN" sync run && "$GGEN" receipt verify)
            (cd packs/clap-noun-verb-capability-pack && "$GGEN" sync run && "$GGEN" receipt verify)
            git diff --exit-code -- examples/greet-demo/src/verbs packs/clap-noun-verb-capability-pack/consumer
            test -s .ggen-v2/receipt.json
            test -s examples/greet-demo/.ggen-v2/receipt.json
            test -s packs/clap-noun-verb-capability-pack/.ggen-v2/receipt.json

            cp examples/greet-demo/ontology.ttl /tmp/greet-ontology.ttl
            trap '\''cp /tmp/greet-ontology.ttl examples/greet-demo/ontology.ttl'\'' EXIT
            cat >> examples/greet-demo/ontology.ttl <<'\''TTL'\''
          <http://clap-noun-verb.io/examples/greet-demo#collision-a>
            a <http://clap-noun-verb.io/ontology#Argument> ;
            <http://clap-noun-verb.io/ontology#hasArgumentName> "dry-run" .
          <http://clap-noun-verb.io/examples/greet-demo#collision-b>
            a <http://clap-noun-verb.io/ontology#Argument> ;
            <http://clap-noun-verb.io/ontology#hasArgumentName> "dry_run" .
          <http://clap-noun-verb.io/examples/greet-demo#greet>
            <http://clap-noun-verb.io/ontology#hasArguments>
              <http://clap-noun-verb.io/examples/greet-demo#collision-a>,
              <http://clap-noun-verb.io/examples/greet-demo#collision-b> .
          TTL
            set +e
            (cd examples/greet-demo && "$GGEN" sync run) >/tmp/collision.out 2>/tmp/collision.err
            collision_code=$?
            set -e
            cp /tmp/greet-ontology.ttl examples/greet-demo/ontology.ttl
            trap - EXIT
            test "$collision_code" -ne 0
            grep -Ei '\''collision|cnv-fieldname-collision'\'' /tmp/collision.err

            pack=packs/clap-noun-verb-capability-pack
            cp "$pack/ontology.ttl" /tmp/capability-ontology.ttl
            trap '\''cp /tmp/capability-ontology.ttl packs/clap-noun-verb-capability-pack/ontology.ttl'\'' EXIT
            cat >> "$pack/ontology.ttl" <<'\''TTL'\''
          <https://chatmangpt.com/ns/clap-noun-verb#illegal-sixteenth>
            a <https://chatmangpt.com/ns/clap-noun-verb#Capability> ;
            <https://chatmangpt.com/ns/clap-noun-verb#featureName> "illegal-sixteenth" ;
            <https://chatmangpt.com/ns/clap-noun-verb#family> "refusal" ;
            <https://chatmangpt.com/ns/clap-noun-verb#defaultVerb> "refuse" ;
            <https://chatmangpt.com/ns/clap-noun-verb#implementation> "none" ;
            <https://chatmangpt.com/ns/clap-noun-verb#proofSurfaceCount> 3 .
          TTL
            set +e
            (cd "$pack" && "$GGEN" sync run) >/tmp/crown.out 2>/tmp/crown.err
            crown_code=$?
            set -e
            cp /tmp/capability-ontology.ttl "$pack/ontology.ttl"
            trap - EXIT
            test "$crown_code" -ne 0
            grep -Ei '\''capability|gate|validation|violation'\'' /tmp/crown.err
          '
          code=$?
          set -e
          echo "$code" > target/ci/gates/semantic.exit
          echo "gate=semantic exit=$code"

      - name: Checkout pinned wasm4pm receipt verifier
        id: wasm_checkout
        continue-on-error: true
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: ${{ env.WASM4PM_REPOSITORY }}
          ref: ${{ env.WASM4PM_SHA }}
          path: .tooling/wasm4pm
          fetch-depth: 1

      - name: Build authoritative OCEL verifier
        id: wasm_build
        if: steps.wasm_checkout.outcome == 'success'
        continue-on-error: true
        run: |
          rustup default "$RUST_STABLE"
          cargo build --manifest-path .tooling/wasm4pm/Cargo.toml -p wasm4pm-cli --bin wpm

      - name: Manufacture receipt only for a complete crown
        id: receipt
        if: always()
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          WASM_CHECKOUT: ${{ steps.wasm_checkout.outcome }}
          WASM_BUILD: ${{ steps.wasm_build.outcome }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          required = [
              'unfinished-work','format','clippy','feature-closure','registry-unit',
              'all-features','witness-replay','docs-benchmark','supply-chain','msrv','semantic',
          ]
          exits = {}
          for name in required:
              path = Path(f'target/ci/gates/{name}.exit')
              exits[name] = int(path.read_text().strip()) if path.exists() else 127
          Path('target/ci/GATE_EXITS.json').write_text(json.dumps(exits, indent=2, sort_keys=True) + '\n')
          if any(exits.values()):
              raise SystemExit(42)
          PY
          gates_code=$?
          if [ "$gates_code" -ne 0 ] || [ "$WASM_CHECKOUT" != success ] || [ "$WASM_BUILD" != success ]; then
            printf 'receipt not manufactured: gates=%s wasm_checkout=%s wasm_build=%s\n' \
              "$gates_code" "$WASM_CHECKOUT" "$WASM_BUILD" > target/ci/RECEIPT_NOT_MANUFACTURED.txt
            echo 1 > target/ci/gates/receipt.exit
            exit 0
          fi

          observed_at=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
          semantic_event='[]'
          if [ "$(cat target/ci/semantic-required.txt)" = true ]; then
            semantic_event='["ggen-semantic-replay"]'
          fi
          jq -n \
            --arg sha "$HEAD_SHA" \
            --arg observed_at "$observed_at" \
            --arg ggen "$GGEN_SHA" \
            --arg wasm4pm "$WASM4PM_SHA" \
            --argjson semantic_event "$semantic_event" \
            '(["unfinished-work-refusal","format","clippy","feature-closure","registry-unit","workspace-all-features","witness-replay","rustdoc-benchmark-build","supply-chain","msrv"] + $semantic_event) as $rungs |
            {
              truex_profile:"truex.ocel2.receipt.v1",
              session_id:("clap-noun-verb-verify:" + $sha),
              admission_status:"ReceiptAdmitted",
              observed_at:$observed_at,
              ocel2:{
                eventTypes:{Verification:{attributes:["rung","result","head_sha"]}},
                objectTypes:{Repository:{attributes:["head_sha","ggen_sha","wasm4pm_sha","actuation_performed"]}},
                events:($rungs | map({"ocel:id":("verify:" + .),"ocel:type":"Verification","ocel:timestamp":$observed_at,"ocel:attributes":{rung:.,result:"success",head_sha:$sha}})),
                objects:[{"ocel:id":("repository:" + $sha),"ocel:type":"Repository","ocel:attributes":{head_sha:$sha,ggen_sha:$ggen,wasm4pm_sha:$wasm4pm,actuation_performed:false}}],
                "event-object":($rungs | map({"ocel:event-id":("verify:" + .),"ocel:object-id":("repository:" + $sha),"ocel:qualifier":"verified"})),
                "object-object":[],
                objectChanges:[]
              }
            }' > target/ci/VERIFICATION.ocel2.json

          .tooling/wasm4pm/target/debug/wpm receipt verify-ocel2 target/ci/VERIFICATION.ocel2.json
          .tooling/wasm4pm/target/debug/wpm receipt canonicalize-ocel2 target/ci/VERIFICATION.ocel2.json > target/ci/VERIFICATION.canonical.txt
          echo 0 > target/ci/gates/receipt.exit

      - name: Record exact-head standing
        if: always()
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          WASM_CHECKOUT: ${{ steps.wasm_checkout.outcome }}
          WASM_BUILD: ${{ steps.wasm_build.outcome }}
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          gates = {}
          for path in sorted(Path('target/ci/gates').glob('*.exit')):
              gates[path.stem] = int(path.read_text().strip())
          expected = {
              'unfinished-work','format','clippy','feature-closure','registry-unit',
              'all-features','witness-replay','docs-benchmark','supply-chain','msrv','semantic','receipt',
          }
          for missing in expected - gates.keys():
              gates[missing] = 127
          passed = all(code == 0 for code in gates.values()) and os.environ['WASM_CHECKOUT'] == 'success' and os.environ['WASM_BUILD'] == 'success'
          if passed:
              standing = 'ALIVE'
          elif gates.get('unfinished-work') not in (0, None):
              standing = 'REFUSED:UNFINISHED_WORK_OR_STATIC_CONTRACT'
          else:
              standing = 'BUILD_BROKEN'
          report = {
              'schema_version':'1.0.0',
              'repository':os.environ['GITHUB_REPOSITORY'],
              'head_sha':os.environ['HEAD_SHA'],
              'standing':standing,
              'semantic_required':Path('target/ci/semantic-required.txt').read_text().strip() == 'true',
              'gate_exits':dict(sorted(gates.items())),
              'wasm4pm_checkout':os.environ['WASM_CHECKOUT'],
              'wasm4pm_build':os.environ['WASM_BUILD'],
              'execution_observed':True,
              'actuation_performed':False,
              'receipt_verified':gates.get('receipt') == 0,
          }
          Path('target/ci/VERIFIER_REPORT.json').write_text(json.dumps(report, indent=2, sort_keys=True) + '\n')
          print(json.dumps(report, indent=2, sort_keys=True))
          PY

      - name: Upload bounded evidence
        if: always()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08
        with:
          name: clap-noun-verb-verify-${{ github.event.pull_request.head.sha || github.sha }}
          path: target/ci
          if-no-files-found: error
          retention-days: 14

      - name: Enforce crown
        if: always()
        run: jq -e '.standing == "ALIVE" and .receipt_verified == true and .actuation_performed == false' target/ci/VERIFIER_REPORT.json
