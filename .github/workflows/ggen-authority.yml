name: ggen authority and replay

on:
  pull_request:
    paths:
      - "AGENTS.md"
      - "Cargo.toml"
      - "ggen.toml"
      - "package.toml"
      - "ontology/**"
      - "gates/**"
      - "queries/**"
      - "templates/**"
      - "packs/**"
      - "examples/greet-demo/**"
      - "src/capability/**"
      - "src/frontier.rs"
      - "src/federation/**"
      - "src/otel.rs"
      - "scripts/verify_ggen_contract.py"
      - "scripts/test_verify_ggen_contract.py"
      - ".github/workflows/ggen-authority.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ggen-authority-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: false

env:
  GGEN_REPOSITORY: seanchatmangpt/ggen
  GGEN_SHA: 68952593c40214ac1a681073d65f3902a9cdfce4

jobs:
  observe-manufacture-falsify-replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Checkout pinned ggen actuator
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: ${{ env.GGEN_REPOSITORY }}
          ref: ${{ env.GGEN_SHA }}
          path: .tooling/ggen
          fetch-depth: 1

      - name: Provision pinned ggen toolchain
        uses: ./.tooling/ggen/.github/actions/setup-ggen-build

      - name: Compile static contract verifier and falsifiers
        run: |
          python3 -m py_compile scripts/verify_ggen_contract.py scripts/test_verify_ggen_contract.py
          python3 -m unittest scripts/test_verify_ggen_contract.py -v
          python3 scripts/verify_ggen_contract.py --json | tee /tmp/ggen-contract.json

      - name: Build exact ggen actuator
        run: cargo build --manifest-path .tooling/ggen/Cargo.toml -p ggen-cli-lib --bin ggen

      - name: Admit root pack and verify receipt
        run: |
          ./.tooling/ggen/target/debug/ggen sync run
          ./.tooling/ggen/target/debug/ggen receipt verify

      - name: Manufacture executable consumer proof
        working-directory: examples/greet-demo
        run: |
          ../../.tooling/ggen/target/debug/ggen sync run
          ../../.tooling/ggen/target/debug/ggen receipt verify
          cargo check
          cargo test
          cargo run --quiet -- tool greet --name Sean | tee /tmp/greet-output.json
          grep -q 'Sean' /tmp/greet-output.json

      - name: Prove full argument projection semantics
        working-directory: examples/greet-demo
        run: |
          cp ontology.ttl /tmp/greet-argument-ontology.ttl
          cp src/handlers.rs /tmp/greet-argument-handlers.rs
          cat >> ontology.ttl <<'TTL'

          ex:greet_name
            cnv:argumentType cnv:ArgumentType_Optional ;
            cnv:cliPosition 1 ;
            cnv:defaultValue "world" .

          ex:convert_type
            cnv:argumentType cnv:ArgumentType_Required ;
            cnv:shortName "t" .

          ex:convert_dryrun
            cnv:argumentType cnv:ArgumentType_Flag ;
            cnv:shortName "d" .
          TTL
          python3 - <<'PY'
          from pathlib import Path
          path = Path("src/handlers.rs")
          text = path.read_text()
          text = text.replace(
              "pub fn convert(dry_run: Option<bool>, r#type: String) -> Result<()> {",
              "pub fn convert(dry_run: bool, r#type: String) -> Result<()> {",
          )
          text = text.replace(
              "    let dry = dry_run.unwrap_or(false);",
              "    let dry = dry_run;",
          )
          path.write_text(text)
          PY
          ../../.tooling/ggen/target/debug/ggen sync run
          ../../.tooling/ggen/target/debug/ggen receipt verify
          grep -q 'index = 1' src/verbs/greet.rs
          grep -q 'default_value = "world"' src/verbs/greet.rs
          grep -q 'short = .t.' src/verbs/convert.rs
          grep -q 'short = .d.' src/verbs/convert.rs
          grep -q 'action = "set_true"' src/verbs/convert.rs
          grep -q 'dry_run: bool' src/verbs/convert.rs
          cargo check
          cargo test
          cargo run --quiet -- tool greet Sean | tee /tmp/greet-positional-output.json
          cargo run --quiet -- tool convert -t json -d | tee /tmp/convert-flag-output.json
          cargo run --quiet -- tool convert --help | tee /tmp/convert-help.txt
          grep -q 'Sean' /tmp/greet-positional-output.json
          grep -q 'dry_run=true' /tmp/convert-flag-output.json
          grep -q -- '--dry-run' /tmp/convert-help.txt
          grep -q 'Preview without writing' /tmp/convert-help.txt
          mv /tmp/greet-argument-ontology.ttl ontology.ttl
          mv /tmp/greet-argument-handlers.rs src/handlers.rs
          ../../.tooling/ggen/target/debug/ggen sync run
          ../../.tooling/ggen/target/debug/ggen receipt verify

      - name: Refuse invalid argument semantics and projection delimiters
        run: |
          cp examples/greet-demo/ontology.ttl /tmp/greet-argument-refusal.ttl
          cat >> examples/greet-demo/ontology.ttl <<'TTL'

          <http://clap-noun-verb.io/examples/greet-demo#greet_name>
            <http://clap-noun-verb.io/ontology#shortName> "too-long" .
          TTL
          set +e
          (cd examples/greet-demo && ../../.tooling/ggen/target/debug/ggen sync run) >/tmp/argument-semantics.out 2>/tmp/argument-semantics.err
          code=$?
          set -e
          mv /tmp/greet-argument-refusal.ttl examples/greet-demo/ontology.ttl
          test "$code" -ne 0
          grep -Ei 'argument|semantics|short' /tmp/argument-semantics.err

          cp examples/greet-demo/ontology.ttl /tmp/greet-delimiter-refusal.ttl
          cat >> examples/greet-demo/ontology.ttl <<'TTL'

          <http://clap-noun-verb.io/examples/greet-demo#greet_name>
            <http://clap-noun-verb.io/ontology#argumentAbout> "ambiguous|projection" .
          TTL
          set +e
          (cd examples/greet-demo && ../../.tooling/ggen/target/debug/ggen sync run) >/tmp/projection-delimiter.out 2>/tmp/projection-delimiter.err
          code=$?
          set -e
          mv /tmp/greet-delimiter-refusal.ttl examples/greet-demo/ontology.ttl
          test "$code" -ne 0
          grep -Ei 'delimiter|projection|argument' /tmp/projection-delimiter.err

      - name: Snapshot root declared consequences
        run: |
          python3 - <<'PY'
          import hashlib, json, tomllib
          from pathlib import Path
          root = Path('examples/greet-demo')
          manifest = tomllib.loads((root / 'ggen.toml').read_text())
          outputs = {}
          for rule in manifest['generation']['rules']:
              pattern = rule['output_file']
              if '{{ verb_name }}' in pattern:
                  paths = sorted((root / 'src/verbs').glob('*.rs'))
              else:
                  paths = [root / pattern]
              for path in paths:
                  outputs[str(path)] = hashlib.sha256(path.read_bytes()).hexdigest()
          Path('/tmp/ggen-first.json').write_text(json.dumps(outputs, indent=2, sort_keys=True) + '\n')
          PY

      - name: Prove root byte-identical replay
        working-directory: examples/greet-demo
        run: |
          ../../.tooling/ggen/target/debug/ggen sync run
          ../../.tooling/ggen/target/debug/ggen receipt verify
          python3 - <<'PY'
          import hashlib, json, tomllib
          from pathlib import Path
          expected = json.loads(Path('/tmp/ggen-first.json').read_text())
          manifest = tomllib.loads(Path('ggen.toml').read_text())
          actual = {}
          for rule in manifest['generation']['rules']:
              pattern = rule['output_file']
              if '{{ verb_name }}' in pattern:
                  paths = sorted(Path('src/verbs').glob('*.rs'))
              else:
                  paths = [Path(pattern)]
              for path in paths:
                  actual[str(Path('examples/greet-demo') / path)] = hashlib.sha256(path.read_bytes()).hexdigest()
          assert actual == expected, {'expected': expected, 'actual': actual}
          PY

      - name: Refuse field-name collision
        run: |
          cp examples/greet-demo/ontology.ttl /tmp/greet-ontology.ttl
          cat >> examples/greet-demo/ontology.ttl <<'TTL'

          <http://clap-noun-verb.io/examples/greet-demo#collision-a>
            a <http://clap-noun-verb.io/ontology#Argument> ;
            <http://clap-noun-verb.io/ontology#hasArgumentName> "dry-run" .
          <http://clap-noun-verb.io/examples/greet-demo#collision-b>
            a <http://clap-noun-verb.io/ontology#Argument> ;
            <http://clap-noun-verb.io/ontology#hasArgumentName> "dry_run" .
          <http://clap-noun-verb.io/examples/greet-demo#greet>
            <http://clap-noun-verb.io/ontology#hasArguments>
              <http://clap-noun-verb.io/examples/greet-demo#collision-a>,
              <http://clap-noun-verb.io/examples/greet-demo#collision-b> .
          TTL
          set +e
          (cd examples/greet-demo && ../../.tooling/ggen/target/debug/ggen sync run) >/tmp/collision.out 2>/tmp/collision.err
          code=$?
          set -e
          mv /tmp/greet-ontology.ttl examples/greet-demo/ontology.ttl
          test "$code" -ne 0
          grep -Ei 'collision|cnv-fieldname-collision' /tmp/collision.err

      - name: Manufacture 15-capability crown
        working-directory: packs/clap-noun-verb-capability-pack
        run: |
          ../../.tooling/ggen/target/debug/ggen sync run
          ../../.tooling/ggen/target/debug/ggen receipt verify
          jq -e '.admission == "ADMITTED" and .standing == "UNKNOWN" and .capabilities == 15 and .proof_surfaces == 45 and .actuation_performed == false' VERIFIER_REPORT.json
          cargo test --manifest-path consumer/Cargo.toml
          sha256sum consumer/Cargo.toml consumer/src/lib.rs VERIFIER_REPORT.json \
            > /tmp/capability-first.sha256

      - name: Prove capability crown byte-identical replay
        working-directory: packs/clap-noun-verb-capability-pack
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          ../../.tooling/ggen/target/debug/ggen sync run
          ../../.tooling/ggen/target/debug/ggen receipt verify
          sha256sum consumer/Cargo.toml consumer/src/lib.rs VERIFIER_REPORT.json \
            > /tmp/capability-second.sha256
          diff -u /tmp/capability-first.sha256 /tmp/capability-second.sha256
          cargo test --manifest-path consumer/Cargo.toml
          jq --arg head "$HEAD_SHA" \
            '.scope = "ggen-semantic-manufacture" |
             .standing = "PARTIAL_ALIVE" |
             .execution_required = true |
             .manufacture_observed = true |
             .consumer_execution_observed = true |
             .source_execution_observed = false |
             .replay_verified = true |
             .head_sha = $head' \
            VERIFIER_REPORT.json > /tmp/capability-verifier.json
          jq -e '.scope == "ggen-semantic-manufacture" and .standing == "PARTIAL_ALIVE" and .manufacture_observed == true and .consumer_execution_observed == true and .source_execution_observed == false and .replay_verified == true' \
            /tmp/capability-verifier.json

      - name: Refuse incomplete capability crown
        run: |
          pack=packs/clap-noun-verb-capability-pack
          cp "$pack/ontology.ttl" /tmp/capability-ontology.ttl
          cat >> "$pack/ontology.ttl" <<'TTL'

          <https://chatmangpt.com/ns/clap-noun-verb#illegal-sixteenth>
            a <https://chatmangpt.com/ns/clap-noun-verb#Capability> ;
            <https://chatmangpt.com/ns/clap-noun-verb#featureName> "illegal-sixteenth" ;
            <https://chatmangpt.com/ns/clap-noun-verb#family> "refusal" ;
            <https://chatmangpt.com/ns/clap-noun-verb#defaultVerb> "refuse" ;
            <https://chatmangpt.com/ns/clap-noun-verb#implementation> "none" ;
            <https://chatmangpt.com/ns/clap-noun-verb#proofSurfaceCount> 3 .
          TTL
          set +e
          (cd "$pack" && ../../.tooling/ggen/target/debug/ggen sync run) >/tmp/crown.out 2>/tmp/crown.err
          code=$?
          set -e
          mv /tmp/capability-ontology.ttl "$pack/ontology.ttl"
          test "$code" -ne 0
          grep -Ei 'capability|gate|validation|violation' /tmp/crown.err

      - name: Execute load-bearing library registry proof
        run: cargo test -p clap-noun-verb --lib

      - name: Refuse generated drift and unreceipted consequences
        run: |
          python3 scripts/verify_ggen_contract.py
          git diff --exit-code -- examples/greet-demo/src/verbs
          test -s .ggen-v2/receipt.json
          test -s examples/greet-demo/.ggen-v2/receipt.json
          test -s packs/clap-noun-verb-capability-pack/.ggen-v2/receipt.json

      - name: Materialize bounded evidence bundle
        run: |
          mkdir -p .ggen-ci
          cp /tmp/ggen-contract.json .ggen-ci/contract.json
          cp /tmp/ggen-first.json .ggen-ci/first-output-digests.json
          cp /tmp/greet-output.json .ggen-ci/greet-output.json
          cp /tmp/greet-positional-output.json .ggen-ci/greet-positional-output.json
          cp /tmp/convert-flag-output.json .ggen-ci/convert-flag-output.json
          cp /tmp/convert-help.txt .ggen-ci/convert-help.txt
          cp /tmp/capability-first.sha256 .ggen-ci/capability-first.sha256
          cp /tmp/capability-second.sha256 .ggen-ci/capability-second.sha256
          cp /tmp/capability-verifier.json .ggen-ci/CAPABILITY_VERIFIER_REPORT.json

      - name: Upload verifier and ggen receipts
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08
        with:
          name: clap-noun-verb-ggen-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            .ggen-ci
            .ggen-v2/receipt.json
            examples/greet-demo/.ggen-v2/receipt.json
            packs/clap-noun-verb-capability-pack/.ggen-v2/receipt.json
          if-no-files-found: error
