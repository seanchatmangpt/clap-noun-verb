name: Marketplace

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: marketplace-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  GGEN_MARKETPLACE_REPOSITORY: seanchatmangpt/ggen-marketplace
  GGEN_MARKETPLACE_SHA: 3c835a6935320a90bad4fc94cc0904908492437c

jobs:
  qualify:
    name: Exact-head marketplace qualification
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1

      - name: Checkout pinned ggen-marketplace capability source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: ${{ env.GGEN_MARKETPLACE_REPOSITORY }}
          ref: ${{ env.GGEN_MARKETPLACE_SHA }}
          path: .tooling/ggen-marketplace
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"

      - name: Set up pinned star-toml toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: nightly-2026-04-15
          components: rustfmt

      - name: Admit marketplace operational law through star-toml
        run: |
          set -euo pipefail
          mkdir -p target/ci/marketplace
          admitted="$(bash .tooling/ggen-marketplace/scripts/admit-config.sh)"
          echo "GGEN_MARKETPLACE_ADMITTED_CONFIG=$admitted" >> "$GITHUB_ENV"
          cp "$admitted" target/ci/marketplace/config-admission.json
          jq -e '.q_config == 1 and .standing == "ADMITTED" and (.witness_blake3 | length) == 64' \
            target/ci/marketplace/config-admission.json

      - name: Install ggen from admitted marketplace config
        run: |
          set -euo pipefail
          ggen_bin="$(bash .tooling/ggen-marketplace/scripts/install-ggen.sh "$GGEN_MARKETPLACE_ADMITTED_CONFIG")"
          echo "GGEN_BIN=$ggen_bin" >> "$GITHUB_ENV"
          "$ggen_bin" --version | tee target/ci/marketplace/ggen-version.txt

      - name: Qualify marketplace and require decomposed clap packs
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          bash .tooling/ggen-marketplace/scripts/qualify-marketplace.sh \
            "$GGEN_MARKETPLACE_ADMITTED_CONFIG" \
            target/ci/marketplace/qualification.json
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path

          required = {
              'clap-noun-verb-schema-pack',
              'clap-noun-verb-crate-pack',
              'clap-noun-verb-routing-pack',
              'clap-noun-verb-behavior-pack',
              'clap-noun-verb-boundary-pack',
              'clap-noun-verb-verification-pack',
          }
          report_path = Path('target/ci/marketplace/qualification.json')
          report = json.loads(report_path.read_text())
          admitted = json.loads(Path('target/ci/marketplace/config-admission.json').read_text())
          observed = {item['name']: item for item in report['packs']}
          missing = sorted(required - observed.keys())
          refused = sorted(name for name in required if name in observed and observed[name]['status'] != 'ALIVE')
          if missing or refused:
              raise SystemExit(f'REFUSED:GGEN_MARKETPLACE_CLAP_COMPOSITION:missing={missing}:refused={refused}')
          installer = Path('.tooling/ggen-marketplace/scripts/install-ggen.sh').read_bytes()
          receipt = {
              'schema_version': '2.0.0',
              'repository': os.environ['GITHUB_REPOSITORY'],
              'head_sha': os.environ['HEAD_SHA'],
              'ggen_marketplace_sha': os.environ['GGEN_MARKETPLACE_SHA'],
              'star_toml_sha': admitted['star_toml_sha'],
              'config_witness_blake3': admitted['witness_blake3'],
              'q_config': admitted['q_config'],
              'ggen_installer_sha256': hashlib.sha256(installer).hexdigest(),
              'ggen_version': Path('target/ci/marketplace/ggen-version.txt').read_text().strip(),
              'required_packs': sorted(required),
              'pack_count': len(report['packs']),
              'standing': 'ALIVE',
              'actuation_performed': False,
          }
          Path('target/ci/marketplace/VERIFIER_REPORT.json').write_text(
              json.dumps(receipt, indent=2, sort_keys=True) + '\n'
          )
          print(json.dumps(receipt, indent=2, sort_keys=True))
          PY

      - name: Replay marketplace qualification from admitted config
        run: |
          set -euo pipefail
          bash .tooling/ggen-marketplace/scripts/qualify-marketplace.sh \
            "$GGEN_MARKETPLACE_ADMITTED_CONFIG" \
            target/ci/marketplace/qualification-replay.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          def normalized(path):
              payload = json.loads(Path(path).read_text())
              return [(p['name'], p['profile'], p['status'], p.get('consequence_sha256'), p.get('source_sha256')) for p in payload['packs']]
          if normalized('target/ci/marketplace/qualification.json') != normalized('target/ci/marketplace/qualification-replay.json'):
              raise SystemExit('REFUSED:GGEN_MARKETPLACE_NONDETERMINISTIC_REPLAY')
          PY

      - name: Upload marketplace receipts
        if: always()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08
        with:
          name: clap-noun-verb-marketplace-${{ github.event.pull_request.head.sha || github.sha }}
          path: target/ci/marketplace
          if-no-files-found: error
          retention-days: 14

      - name: Enforce marketplace crown
        run: jq -e '.standing == "ALIVE" and .q_config == 1 and .actuation_performed == false and (.config_witness_blake3 | length) == 64' target/ci/marketplace/VERIFIER_REPORT.json
