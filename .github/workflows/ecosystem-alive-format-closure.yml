name: Ecosystem ALIVE Format Closure

on:
  pull_request:
    paths:
      - "examples/**"
      - "src/**"
      - "tests/frontier/capability_crown_test.rs"
      - "tests/gap_federation_mod_tests.rs"
      - ".github/workflows/ecosystem-alive-format-closure.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ecosystem-alive-format-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

env:
  RUSTC_WRAPPER: ""

jobs:
  repair-and-prove:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout exact repair branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 0

      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt

      - name: Format and enforce handwritten allowlist
        run: |
          cargo fmt --all
          python3 - <<'PY'
          import subprocess
          allowed = {
              'examples/agent_cli_builder.rs','examples/app_context.rs','examples/capability_registry.rs',
              'examples/command_tree.rs','examples/diagnostics.rs','examples/format_error_pipeline.rs',
              'examples/frontier_discovery_engine_demo.rs','examples/ontology_to_cli.rs','examples/output_formats.rs',
              'examples/proc_macro_verb.rs','examples/repl_witness.rs','examples/revops_cs_checkins.rs',
              'examples/revops_email_sequences.rs','examples/revops_financial_forecast.rs',
              'examples/revops_revenue_dashboard.rs','examples/revops_sales_pipeline.rs',
              'src/capability/mod.rs','src/capability/registry.rs','src/cli/mod.rs','src/error.rs',
              'src/federation/mod.rs','src/frontier.rs','src/ggen_to_rdf.rs','src/lib.rs',
              'src/ontology_sync.rs','src/rdf_to_ggen.rs',
              'tests/frontier/capability_crown_test.rs','tests/gap_federation_mod_tests.rs',
          }
          changed = set(subprocess.check_output(['git','diff','--name-only'], text=True).splitlines())
          unexpected = sorted(changed - allowed)
          if unexpected:
              raise SystemExit(f'FORMAT_PATH_ESCAPE_REFUSED: {unexpected}')
          print({'changed': sorted(changed), 'generated_paths_changed': False})
          PY

      - name: Commit exact formatter consequence
        run: |
          git config user.name "clap-noun-verb-alive-controller"
          git config user.email "clap-noun-verb-alive-controller@users.noreply.github.com"
          git add examples src tests/frontier/capability_crown_test.rs tests/gap_federation_mod_tests.rs
          if ! git diff --cached --quiet; then
            git commit -m "style(cli): close rustfmt drift"
          fi

      - name: Execute repository validation ladder
        run: |
          cargo fmt --all -- --check
          cargo test --workspace --all-features
          cargo clippy --workspace --all-features --all-targets -- -D warnings
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Publish verified repair
        run: git push origin "HEAD:${{ github.event.pull_request.head.ref || github.ref_name }}"
