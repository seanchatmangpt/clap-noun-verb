name: Release Gate Diagnostics

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-gate-diagnostics-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: never
  RUST_STABLE: "1.97.1"

jobs:
  diagnostics:
    name: Exact-head release gate diagnostics
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1

      - name: Provision pinned stable Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: ${{ env.RUST_STABLE }}
          components: rustfmt, clippy

      - name: Capture exact gate diagnostics
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -uo pipefail
          mkdir -p target/ci/gate-diagnostics

          set +e
          cargo fmt --all -- --check 2>&1 | tee target/ci/gate-diagnostics/format.log
          format_code=${PIPESTATUS[0]}
          cargo clippy --workspace --all-targets --all-features 2>&1 | tee target/ci/gate-diagnostics/clippy.log
          clippy_code=${PIPESTATUS[0]}
          (set -euo pipefail; RUSTDOCFLAGS='-D warnings' cargo doc --workspace --all-features --no-deps; cargo bench -p clap-noun-verb --bench dispatch --all-features --no-run) 2>&1 | tee target/ci/gate-diagnostics/docs-benchmark.log
          docs_benchmark_code=${PIPESTATUS[0]}
          set -e

          jq -n \
            --argjson format "$format_code" \
            --argjson clippy "$clippy_code" \
            --argjson docs_benchmark "$docs_benchmark_code" \
            '{
              "format":{"command":"cargo fmt --all -- --check","exit_code":$format},
              "clippy":{"command":"cargo clippy --workspace --all-targets --all-features","exit_code":$clippy},
              "docs-benchmark":{"command":"RUSTDOCFLAGS=-D warnings cargo doc --workspace --all-features --no-deps && cargo bench -p clap-noun-verb --bench dispatch --all-features --no-run","exit_code":$docs_benchmark}
            }' > target/ci/gate-diagnostics/outcomes.json

          python3 -m py_compile scripts/verify_gate_diagnostics.py scripts/test_verify_gate_diagnostics.py
          python3 -m unittest scripts/test_verify_gate_diagnostics.py -v
          python3 scripts/verify_gate_diagnostics.py \
            --subject "$HEAD_SHA" \
            --outcomes target/ci/gate-diagnostics/outcomes.json \
            --diagnostics-dir target/ci/gate-diagnostics \
            --report target/ci/gate-diagnostics/REPORT.first.json
          python3 scripts/verify_gate_diagnostics.py \
            --subject "$HEAD_SHA" \
            --outcomes target/ci/gate-diagnostics/outcomes.json \
            --diagnostics-dir target/ci/gate-diagnostics \
            --report target/ci/gate-diagnostics/REPORT.second.json
          cmp target/ci/gate-diagnostics/REPORT.first.json target/ci/gate-diagnostics/REPORT.second.json
          cp target/ci/gate-diagnostics/REPORT.first.json target/ci/gate-diagnostics/REPORT.json

      - name: Upload replayable diagnostic evidence
        if: always()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08
        with:
          name: release-gate-diagnostics-${{ github.event.pull_request.head.sha || github.sha }}
          path: target/ci/gate-diagnostics
          if-no-files-found: error
          retention-days: 14

      - name: Enforce diagnostic admission and preserve quality failures
        if: always()
        run: |
          jq -e '.admission == "ADMITTED" and .diagnostics_complete == true and .actuation_performed == false' target/ci/gate-diagnostics/REPORT.json
          jq -e '.standing == "ALIVE"' target/ci/gate-diagnostics/REPORT.json
