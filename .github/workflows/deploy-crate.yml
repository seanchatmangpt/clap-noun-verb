name: Deploy Crate

on:
  pull_request:
    paths:
      - 'clap-noun-verb-deploy/**'
      - '.github/workflows/deploy-crate.yml'
  push:
    branches: [main]
    paths:
      - 'clap-noun-verb-deploy/**'
      - '.github/workflows/deploy-crate.yml'

jobs:
  deploy-crate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --manifest-path clap-noun-verb-deploy/Cargo.toml --all -- --check
      - name: Check
        run: cargo check --manifest-path clap-noun-verb-deploy/Cargo.toml --all-features
      - name: Test
        run: cargo test --manifest-path clap-noun-verb-deploy/Cargo.toml --all-features
      - name: Clippy
        run: cargo clippy --manifest-path clap-noun-verb-deploy/Cargo.toml --all-targets --all-features -- -D warnings
      - name: Docs
        run: RUSTDOCFLAGS='-D warnings' cargo doc --manifest-path clap-noun-verb-deploy/Cargo.toml --all-features --no-deps
