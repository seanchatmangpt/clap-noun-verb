name: Capability Crown

on:
  pull_request:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "src/**"
      - "tests/**"
      - "examples/**"
      - "benches/**"
      - "scripts/verify_no_wip.py"
      - "scripts/test_verify_no_wip.py"
      - "scripts/run_witnesses.sh"
      - "DOC_COVERAGE_LOG.md"
      - "packs/clap-noun-verb-capability-pack/**"
      - ".github/workflows/frontier-ci.yml"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: capability-crown-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  WASM4PM_REPOSITORY: seanchatmangpt/wasm4pm
  WASM4PM_SHA: f1d4d7ac8b2f9a0265be82991487766eb35b4675

jobs:
  work-closure:
    name: Unfinished-work refusal contract
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Compile and execute verifier falsifiers
        run: |
          python3 -m py_compile scripts/verify_no_wip.py scripts/test_verify_no_wip.py
          python3 -m unittest scripts/test_verify_no_wip.py -v

      - name: Refuse unfinished admitted surfaces
        run: python3 scripts/verify_no_wip.py --report target/wip-verifier-report.json

      - name: Upload unfinished-work verifier report
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08
        with:
          name: clap-noun-verb-wip-contract-${{ github.event.pull_request.head.sha || github.sha }}
          path: target/wip-verifier-report.json
          if-no-files-found: error

  feature-matrix:
    name: Feature / ${{ matrix.feature }}
    needs: work-closure
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        feature:
          - baseline
          - process-data
          - autonomic
          - contrib
          - repl
          - otel
          - federated-network
          - meta-framework
          - rdf-composition
          - fractal-patterns
          - discovery-engine
          - learning-trajectories
          - reflexive-testing
          - economic-sim
          - quantum-ready
          - executable-specs
          - frontier-semantic
          - frontier-intelligence
          - frontier-quality
          - frontier-all
          - all-features
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Compile feature cell
        env:
          FEATURE: ${{ matrix.feature }}
        run: |
          set -euo pipefail
          case "$FEATURE" in
            baseline)
              cargo check -p clap-noun-verb --all-targets
              ;;
            all-features)
              cargo check -p clap-noun-verb --all-targets --all-features
              ;;
            *)
              cargo check -p clap-noun-verb --all-targets --features "$FEATURE"
              ;;
          esac

  proof-ladder:
    name: Unit → Integration → Replay
    needs: work-closure
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Formatting gate
        run: cargo fmt --all -- --check

      - name: Unit proof
        run: cargo test -p clap-noun-verb --lib

      - name: Frontier integration proof
        run: cargo test -p clap-noun-verb --test frontier_tests --all-features

      - name: Federation integration proof
        run: cargo test -p clap-noun-verb --test gap_federation_mod_tests --features federated-network

      - name: Complete feature proof
        run: cargo test -p clap-noun-verb --all-features

      - name: First executable witness consequence
        run: bash scripts/run_witnesses.sh target/capability-crown/witnesses-first.txt

      - name: Replay executable witness consequence
        run: |
          bash scripts/run_witnesses.sh target/capability-crown/witnesses-second.txt
          cmp target/capability-crown/witnesses-first.txt target/capability-crown/witnesses-second.txt
          sha256sum target/capability-crown/witnesses-first.txt \
            target/capability-crown/witnesses-second.txt \
            > target/capability-crown/witnesses.sha256

      - name: Static quality proof
        run: cargo clippy -p clap-noun-verb --all-targets --all-features -- -D warnings

      - name: Documentation proof
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc -p clap-noun-verb --all-features --no-deps

      - name: Benchmark build proof
        run: cargo bench -p clap-noun-verb --bench dispatch --no-run

      - name: Upload executable proof bundle
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08
        with:
          name: clap-noun-verb-executable-proof-${{ github.event.pull_request.head.sha || github.sha }}
          path: target/capability-crown
          if-no-files-found: error

  verifier-report:
    name: OCEL receipt and machine report
    needs: [work-closure, feature-matrix, proof-ladder]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Refuse incomplete crown
        env:
          WORK_CLOSURE: ${{ needs.work-closure.result }}
          MATRIX: ${{ needs.feature-matrix.result }}
          LADDER: ${{ needs.proof-ladder.result }}
        run: |
          test "$WORK_CLOSURE" = success
          test "$MATRIX" = success
          test "$LADDER" = success

      - name: Checkout pinned wasm4pm verifier
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: ${{ env.WASM4PM_REPOSITORY }}
          ref: ${{ env.WASM4PM_SHA }}
          path: .tooling/wasm4pm
          fetch-depth: 1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build authoritative OCEL verifier
        run: cargo build --manifest-path .tooling/wasm4pm/Cargo.toml -p wasm4pm-cli --bin wpm

      - name: Materialize observed OCEL 2.0 receipt
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          mkdir -p target/capability-crown
          observed_at=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
          jq -n \
            --arg sha "$HEAD_SHA" \
            --arg observed_at "$observed_at" \
            --argjson capabilities '["autonomic","contrib","discovery-engine","economic-sim","executable-specs","federated-network","fractal-patterns","learning-trajectories","meta-framework","otel","process-data","quantum-ready","rdf-composition","reflexive-testing","repl"]' \
            '
            def event($id; $rung): {
              "ocel:id": $id,
              "ocel:type": "Verification",
              "ocel:timestamp": $observed_at,
              "ocel:attributes": {
                "rung": $rung,
                "result": "success",
                "surface_count": 15,
                "head_sha": $sha
              }
            };
            {
              "truex_profile": "truex.ocel2.receipt.v1",
              "session_id": ("clap-noun-verb-capability-crown:" + $sha),
              "admission_status": "ReceiptAdmitted",
              "observed_at": $observed_at,
              "ocel2": {
                "eventTypes": {
                  "Verification": {
                    "attributes": ["rung", "result", "surface_count", "head_sha"]
                  }
                },
                "objectTypes": {
                  "Capability": {
                    "attributes": ["feature", "standing"]
                  }
                },
                "events": [
                  event("evt-unit"; "unit"),
                  event("evt-integration"; "integration"),
                  event("evt-replay"; "replay")
                ],
                "objects": ($capabilities | map({
                  "ocel:id": ("capability:" + .),
                  "ocel:type": "Capability",
                  "ocel:attributes": {"feature": ., "standing": "ALIVE"}
                })),
                "event-object": (["unit", "integration", "replay"] as $rungs |
                  [$rungs[] as $rung | $capabilities[] as $capability | {
                    "ocel:event-id": ("evt-" + $rung),
                    "ocel:object-id": ("capability:" + $capability),
                    "ocel:qualifier": "verified"
                  }]),
                "object-object": [],
                "objectChanges": []
              }
            }
            ' > target/capability-crown/CAPABILITY_CROWN.ocel2.json
          jq -e '.ocel2.objects | length == 15' target/capability-crown/CAPABILITY_CROWN.ocel2.json
          jq -e '.ocel2["event-object"] | length == 45' target/capability-crown/CAPABILITY_CROWN.ocel2.json

      - name: Verify and canonicalize OCEL with wasm4pm
        run: |
          .tooling/wasm4pm/target/debug/wpm receipt verify-ocel2 target/capability-crown/CAPABILITY_CROWN.ocel2.json
          .tooling/wasm4pm/target/debug/wpm receipt canonicalize-ocel2 target/capability-crown/CAPABILITY_CROWN.ocel2.json \
            > target/capability-crown/CAPABILITY_CROWN.canonical.txt

      - name: Materialize verifier report
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          observed_at=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
          jq -n \
            --arg head "$HEAD_SHA" \
            --arg observed_at "$observed_at" \
            --arg verifier "wasm4pm@${WASM4PM_SHA}" \
            '{
              schema_version: "1.0.0",
              head_sha: $head,
              observed_at: $observed_at,
              admission: "ADMITTED",
              standing: "ALIVE",
              capabilities: 15,
              proof_surfaces: 45,
              feature_cells: 21,
              rungs: ["unfinished-work-refusal", "unit", "integration", "all-features", "executable-replay", "clippy", "docs", "benchmark-build", "ocel-verification"],
              ocel_receipt: "CAPABILITY_CROWN.ocel2.json",
              ocel_verifier: $verifier,
              execution_observed: true,
              replay_verified: true,
              actuation_performed: false
            }' > target/capability-crown/VERIFIER_REPORT.json

      - name: Upload OCEL receipt and verifier report
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08
        with:
          name: clap-noun-verb-capability-crown-${{ github.event.pull_request.head.sha || github.sha }}
          path: target/capability-crown
          if-no-files-found: error
