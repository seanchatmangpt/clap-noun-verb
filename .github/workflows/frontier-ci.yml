name: Capability Crown

on:
  pull_request:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "src/**"
      - "tests/**"
      - "benches/**"
      - "packs/clap-noun-verb-capability-pack/**"
      - ".github/workflows/frontier-ci.yml"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: capability-crown-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  feature-matrix:
    name: Feature / ${{ matrix.feature }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        feature:
          - baseline
          - process-data
          - autonomic
          - contrib
          - repl
          - otel
          - federated-network
          - meta-framework
          - rdf-composition
          - fractal-patterns
          - discovery-engine
          - learning-trajectories
          - reflexive-testing
          - economic-sim
          - quantum-ready
          - executable-specs
          - frontier-semantic
          - frontier-intelligence
          - frontier-quality
          - frontier-all
          - all-features
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Compile feature cell
        env:
          FEATURE: ${{ matrix.feature }}
        run: |
          set -euo pipefail
          case "$FEATURE" in
            baseline)
              cargo check -p clap-noun-verb --all-targets
              ;;
            all-features)
              cargo check -p clap-noun-verb --all-targets --all-features
              ;;
            *)
              cargo check -p clap-noun-verb --all-targets --features "$FEATURE"
              ;;
          esac

  proof-ladder:
    name: Unit → Integration → E2E boundary
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Formatting gate
        run: cargo fmt --all -- --check

      - name: Unit proof
        run: cargo test -p clap-noun-verb --lib

      - name: Frontier integration proof
        run: cargo test -p clap-noun-verb --test frontier_tests --all-features

      - name: Federation integration proof
        run: cargo test -p clap-noun-verb --test gap_federation_mod_tests --features federated-network

      - name: Complete feature proof
        run: cargo test -p clap-noun-verb --all-features

      - name: Static quality proof
        run: cargo clippy -p clap-noun-verb --all-targets --all-features -- -D warnings

      - name: Documentation proof
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc -p clap-noun-verb --all-features --no-deps

      - name: Benchmark build proof
        run: cargo bench -p clap-noun-verb --bench dispatch --no-run

  verifier-report:
    name: Machine verifier report
    runs-on: ubuntu-24.04
    needs: [feature-matrix, proof-ladder]
    if: always()
    steps:
      - name: Refuse incomplete crown
        env:
          MATRIX: ${{ needs.feature-matrix.result }}
          LADDER: ${{ needs.proof-ladder.result }}
        run: |
          test "$MATRIX" = success
          test "$LADDER" = success

      - name: Materialize verifier report
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          mkdir -p target/capability-crown
          cat > target/capability-crown/VERIFIER_REPORT.json <<JSON
          {
            "schema_version": "1.0.0",
            "head_sha": "$HEAD_SHA",
            "standing": "ALIVE",
            "capabilities": 15,
            "proof_surfaces": 45,
            "feature_cells": 21,
            "rungs": ["unit", "integration", "all-features", "clippy", "docs", "benchmark-build"],
            "replay_required": true,
            "actuation_performed": false
          }
          JSON

      - name: Upload verifier report
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08
        with:
          name: clap-noun-verb-capability-crown-${{ github.event.pull_request.head.sha || github.sha }}
          path: target/capability-crown/VERIFIER_REPORT.json
          if-no-files-found: error
