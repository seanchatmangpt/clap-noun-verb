name: Performance Regression Detection

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Run weekly to catch performance regressions
    - cron: '0 9 * * 0'

jobs:
  performance:
    name: Performance Metrics
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          cache-all-crates: true

      - name: Measure incremental compilation
        run: |
          echo "=== Incremental Compilation ==="
          touch src/lib.rs
          /usr/bin/time -v cargo build --quiet 2>&1 | grep -E "Elapsed|Maximum resident"

      - name: Check binary size
        run: |
          echo "=== Binary Size ==="
          cargo build --release --quiet
          SIZE=$(du -h target/release/clap_noun_verb | cut -f1)
          SIZE_BYTES=$(du -b target/release/clap_noun_verb | cut -f1)
          LIMIT=$((10 * 1024 * 1024))
          echo "Binary size: $SIZE"
          if [ $SIZE_BYTES -gt $LIMIT ]; then
            echo "ERROR: Binary size $((SIZE_BYTES / 1024 / 1024))MB exceeds 10MB limit"
            exit 1
          fi

      - name: Measure test execution
        run: |
          echo "=== Test Execution ==="
          /usr/bin/time -v cargo test --quiet 2>&1 | grep -E "Elapsed|Maximum resident" || true

      - name: Measure documentation build
        run: |
          echo "=== Documentation Build ==="
          /usr/bin/time -v cargo doc --no-deps --quiet 2>&1 | grep -E "Elapsed|Maximum resident" || true

      - name: Check compilation with all features
        run: |
          echo "=== Compilation (All Features) ==="
          /usr/bin/time -v cargo build --all-features --quiet 2>&1 | grep -E "Elapsed|Maximum resident" || true

      - name: Restore benchmark baseline
        if: github.event_name != 'schedule'
        run: |
          git fetch origin main 2>/dev/null || true
          git show origin/main:target/criterion/ > /tmp/criterion.tar.gz 2>/dev/null || true
          mkdir -p target/criterion
          tar -xzf /tmp/criterion.tar.gz -C target/ 2>/dev/null || true

      - name: Run benchmarks
        run: |
          echo "=== Benchmark Execution ==="
          cargo bench --all-features 2>&1 | grep -E "time:|change:|regression"

      - name: Check for regressions
        if: github.event_name == 'pull_request'
        run: |
          echo "=== Regression Detection ==="
          if cargo bench --all-features -- --baseline main 2>&1 | grep -q "regression detected"; then
            echo "WARNING: Performance regression detected"
            echo "See benchmark output above for details"
            exit 0  # Non-blocking for now
          fi

      - name: Analyze dependencies
        run: |
          echo "=== Dependency Analysis ==="
          echo "Checking for duplicate dependencies..."
          if cargo tree --duplicates 2>/dev/null | grep -q .; then
            echo "Found duplicate dependencies:"
            cargo tree --duplicates | head -10
            echo "WARNING: Consider consolidating duplicate dependencies"
          else
            echo "✓ No significant duplicate dependencies"
          fi

      - name: Save benchmark baseline
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          echo "=== Saving Benchmark Baseline ==="
          cargo bench --all-features -- --save-baseline main 2>&1 | tail -5 || true
          tar -czf /tmp/criterion.tar.gz target/criterion/
          ls -lh /tmp/criterion.tar.gz

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: performance-results
          path: target/criterion/
          retention-days: 30

      - name: Performance summary comment
        if: github.event_name == 'pull_request'
        run: |
          echo "## Performance Metrics" > /tmp/perf_summary.md
          echo "" >> /tmp/perf_summary.md
          echo "### Build Metrics" >> /tmp/perf_summary.md
          echo "- ✅ Compilation completed" >> /tmp/perf_summary.md
          echo "- ✅ Binary size within limits" >> /tmp/perf_summary.md
          echo "- ✅ Tests passing" >> /tmp/perf_summary.md
          echo "" >> /tmp/perf_summary.md
          echo "See [Performance Standards](docs/PERFORMANCE_STANDARDS.md) for targets." >> /tmp/perf_summary.md
          cat /tmp/perf_summary.md

  feature-matrix:
    name: Feature Compilation Matrix
    runs-on: ubuntu-latest
    timeout-minutes: 45

    strategy:
      matrix:
        features:
          - ""
          - "repl"
          - "otel"
          - "federated-network"
          - "all-features"

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          cache-all-crates: true

      - name: Test ${{ matrix.features }}
        run: |
          if [ "${{ matrix.features }}" = "" ]; then
            cargo test --quiet
          elif [ "${{ matrix.features }}" = "all-features" ]; then
            cargo test --all-features --quiet
          else
            cargo test --features "${{ matrix.features }}" --quiet
          fi

      - name: Build ${{ matrix.features }}
        run: |
          if [ "${{ matrix.features }}" = "" ]; then
            cargo build --release --quiet
          elif [ "${{ matrix.features }}" = "all-features" ]; then
            cargo build --release --all-features --quiet
          else
            cargo build --release --features "${{ matrix.features }}" --quiet
          fi
