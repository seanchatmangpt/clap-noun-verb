name: Diagnose CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: diagnose-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: never
  RUST_BACKTRACE: "1"
  RUST_STABLE: "1.97.1"

jobs:
  diagnose:
    name: Exact-head causal evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Provision pinned stable Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: ${{ env.RUST_STABLE }}

      - name: Reuse Rust cache identity
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          key: diagnose-${{ env.RUST_STABLE }}
          cache-all-crates: false

      - name: Exact workspace all-features command
        id: all_features
        continue-on-error: true
        run: |
          mkdir -p target/diag
          set +e
          cargo check --workspace --all-targets --all-features >target/diag/all-features.log 2>&1
          rc=$?
          set -e
          printf '%s\n' "$rc" > target/diag/all-features.exit
          echo "ALL_FEATURES_EXIT=$rc"
          cat target/diag/all-features.log
          exit "$rc"

      - name: Install pinned cargo-deny
        id: deny_install
        if: always()
        continue-on-error: true
        uses: taiki-e/install-action@c505b76b536c2cff45f2b7d03fd8fcdb19103465
        with:
          tool: cargo-deny

      - name: Exact cargo-deny command
        id: supply
        if: always() && steps.deny_install.outcome == 'success'
        continue-on-error: true
        run: |
          mkdir -p target/diag
          set +e
          cargo deny check advisories bans licenses sources >target/diag/cargo-deny.log 2>&1
          rc=$?
          set -e
          printf '%s\n' "$rc" > target/diag/cargo-deny.exit
          echo "CARGO_DENY_EXIT=$rc"
          cat target/diag/cargo-deny.log
          exit "$rc"

      - name: Write diagnostic receipt
        if: always()
        env:
          ALL_FEATURES: ${{ steps.all_features.outcome }}
          DENY_INSTALL: ${{ steps.deny_install.outcome }}
          SUPPLY: ${{ steps.supply.outcome }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          mkdir -p target/diag
          printf '{\n  "head_sha": "%s",\n  "all_features": "%s",\n  "deny_install": "%s",\n  "supply_chain": "%s"\n}\n' \
            "$HEAD_SHA" "$ALL_FEATURES" "$DENY_INSTALL" "$SUPPLY" > target/diag/receipt.json
          cat target/diag/receipt.json

      - name: Upload causal evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clap-noun-verb-diagnose-${{ github.event.pull_request.head.sha || github.sha }}
          path: target/diag
          if-no-files-found: error
          retention-days: 14

      - name: Raw diagnostic standing
        if: always()
        env:
          ALL_FEATURES: ${{ steps.all_features.outcome }}
          DENY_INSTALL: ${{ steps.deny_install.outcome }}
          SUPPLY: ${{ steps.supply.outcome }}
        run: |
          test "$ALL_FEATURES" = success
          test "$DENY_INSTALL" = success
          test "$SUPPLY" = success
