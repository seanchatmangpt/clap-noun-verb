name: Diagnose CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: diagnose-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: never
  RUST_BACKTRACE: "1"
  RUST_STABLE: "1.97.1"
  RUST_MSRV: "1.74.0"

jobs:
  diagnose:
    name: Exact-head causal evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Provision pinned stable Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: ${{ env.RUST_STABLE }}
          components: rustfmt

      - name: Reuse Rust cache identity
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          key: diagnose-${{ env.RUST_STABLE }}
          cache-all-crates: false

      - name: Diagnose formatting
        id: format
        continue-on-error: true
        run: |
          mkdir -p target/diag
          set +e
          cargo fmt --all -- --check >target/diag/format.log 2>&1
          rc=$?
          set -e
          echo "FORMAT_EXIT=$rc"
          tail -n 200 target/diag/format.log
          exit "$rc"

      - name: Diagnose all feature closure
        id: features
        if: always()
        continue-on-error: true
        run: |
          mkdir -p target/diag
          set +e
          {
            cargo check -p clap-noun-verb --all-targets --no-default-features
            python3 - <<'PY'
          import subprocess, tomllib
          with open('Cargo.toml', 'rb') as source:
              features = sorted(tomllib.load(source)['features'])
          for feature in features:
              print(f'feature={feature}', flush=True)
              subprocess.run([
                  'cargo','check','-p','clap-noun-verb','--all-targets',
                  '--no-default-features','--features',feature,
              ], check=True)
          print(f'compiled_features={len(features)}')
          PY
            cargo check --workspace --all-targets --all-features
          } >target/diag/features.log 2>&1
          rc=$?
          set -e
          echo "FEATURES_EXIT=$rc"
          tail -n 240 target/diag/features.log
          exit "$rc"

      - name: Provision declared MSRV
        if: always()
        run: rustup toolchain install "$RUST_MSRV" --profile minimal --no-self-update

      - name: Diagnose MSRV boundary
        id: msrv
        if: always()
        continue-on-error: true
        run: |
          mkdir -p target/diag
          set +e
          cargo +${RUST_MSRV} check -p clap-noun-verb -p clap-noun-verb-macros --all-features >target/diag/msrv.log 2>&1
          rc=$?
          set -e
          echo "MSRV_EXIT=$rc"
          tail -n 240 target/diag/msrv.log
          exit "$rc"

      - name: Raw diagnostic standing
        if: always()
        env:
          FORMAT: ${{ steps.format.outcome }}
          FEATURES: ${{ steps.features.outcome }}
          MSRV: ${{ steps.msrv.outcome }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          printf 'HEAD_SHA=%s\nFORMAT=%s\nFEATURES=%s\nMSRV=%s\n' "$HEAD_SHA" "$FORMAT" "$FEATURES" "$MSRV"
          test "$FORMAT" = success
          test "$FEATURES" = success
          test "$MSRV" = success
