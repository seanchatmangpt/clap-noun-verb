# ggen.toml — clap-noun-verb authoritative pack manifest
#
# Semantic authority lives in RDF. SPARQL performs admitted inference/selection.
# Tera is the terminal projection calculus. package.toml is transport only.
# ggen emits and verifies the BLAKE3 receipt over the input closure and outputs.
# The exact verifier actuator is pinned in .github/workflows/ggen-authority.yml.

[project]
name = "clap-noun-verb"
version = "26.6.14"
description = "Authoritative ggen pack for noun-verb CLIs: admitted RDF manufactures thin #[verb] interfaces while consumer-owned handlers retain domain behavior (A = mu(O*))."

[ontology]
source = "ontology/clap-noun-verb-ontology.ttl"
base_iri = "http://clap-noun-verb.io/ontology#"

[ontology.prefixes]
cnv = "http://clap-noun-verb.io/ontology#"
rdf = "http://www.w3.org/1999/02/22-rdf-syntax-ns#"
rdfs = "http://www.w3.org/2000/01/rdf-schema#"
owl = "http://www.w3.org/2002/07/owl#"
xsd = "http://www.w3.org/2001/XMLSchema#"

# μ₁: normalize noun → verb edges into explicit verb → noun links.
[inference]
[[inference.rules]]
name = "attach-noun-name-to-verb"
construct = """
PREFIX cnv: <http://clap-noun-verb.io/ontology#>
CONSTRUCT {
  ?verb cnv:belongsToNoun ?noun .
} WHERE {
  ?noun a cnv:Noun ; cnv:hasVerbs ?verb .
}
"""

# μ₃: bounded terminal projections. No output may escape src/verbs/.
[generation]
output_dir = "."

[[generation.rules]]
name = "verb-wrappers"
query = { file = "queries/verb-signatures.rq" }
template = { file = "templates/verb.rs.tera" }
output_file = "src/verbs/{{ verb_name }}.rs"
mode = "Overwrite"
skip_empty = true

[[generation.rules]]
name = "verbs-mod"
query = { file = "queries/verbs-mod.rq" }
template = { file = "templates/verbs-mod.rs.tera" }
output_file = "src/verbs/mod.rs"
mode = "Overwrite"
skip_empty = true

# ASK true means a violation exists. The body is byte-semantically aligned with
# ontology/queries/fieldname-collision.rq and is enforced before write actuation.
[[validation.rules]]
name = "cnv-fieldname-collision"
description = "Two distinct arguments on the same verb must not resolve to the same Rust field name. Resolved field = COALESCE(explicit cnv:fieldName, kebab-to-snake cnv:hasArgumentName). A matching pair is a violation and generation is refused."
severity = "Error"
ask = """
ASK {
  ?verb rdf:type cnv:Verb ;
        cnv:hasArguments ?argA ;
        cnv:hasArguments ?argB .
  FILTER( STR(?argA) < STR(?argB) )
  ?argA cnv:hasArgumentName ?flagA .
  ?argB cnv:hasArgumentName ?flagB .
  OPTIONAL { ?argA cnv:fieldName ?explicitA }
  OPTIONAL { ?argB cnv:fieldName ?explicitB }
  BIND( COALESCE( ?explicitA, REPLACE(STR(?flagA), "-", "_") ) AS ?fieldA )
  BIND( COALESCE( ?explicitB, REPLACE(STR(?flagB), "-", "_") ) AS ?fieldB )
  FILTER( ?fieldA = ?fieldB )
}
"""
