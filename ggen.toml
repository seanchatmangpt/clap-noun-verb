# ggen.toml -- generates this repo's own Autonomic Layer, per this
# project's no-hand-coding-clap-noun-verb-code policy. src/autonomic.rs is
# ggen-generated from ontology.ttl below; do not hand-edit it -- edit
# ontology.ttl and run `ggen sync run`.

[project]
name = "clap-noun-verb"

[ontology]
source = "ontology.ttl"

[ontology.prefixes]
cnv-autonomic = "https://clap-noun-verb.dev/ontology/autonomic#"
rdf = "http://www.w3.org/1999/02/22-rdf-syntax-ns#"
rdfs = "http://www.w3.org/2000/01/rdf-schema#"
xsd = "http://www.w3.org/2001/XMLSchema#"

[packs]
clap-noun-verb-autonomic-pack = { path = "/Users/sac/ggen-marketplace/packs/clap-noun-verb-autonomic-pack" }

[templates]
# No project-local templates of our own (only the composed pack's
# template is used) -- pointed at a dedicated, otherwise-empty directory
# rather than "." so this project's ggen sync doesn't recursively scan the
# whole repo tree (which includes clap-noun-verb-any/playground/, a large
# vendored Python project with its own unrelated *.tmpl files).
dir = "ggen-templates"
aggregate_modules = false
