# =============================================================================

[[example]]
name = "ref_attribute_macro"
path = "examples/reference/attribute_macro.rs"

[[example]]
name = "ref_framework"
path = "examples/reference/framework.rs"

[[example]]
name = "ref_nested"
path = "examples/reference/nested.rs"

[[example]]
name = "ref_collector"
path = "examples/reference/collector.rs"

[[example]]
name = "ref_format"
path = "examples/reference/format.rs"

[[example]]
name = "ref_context"
path = "examples/reference/context.rs"

[[example]]
name = "ref_root_verb"
path = "examples/reference/root_verb.rs"

[package.metadata.docs.rs]
# docs.rs build configuration
rustdoc-args = ["--cfg", "docsrs"]
all-features = true

[lints]
workspace = true

[workspace.lints.rust]
# Core team best practices - allow unsafe for linkme
unsafe_code = "allow"
bare_trait_objects = "warn"
# Allow kani and docsrs configuration used by external verifiers.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)', 'cfg(docsrs)'] }
dead_code = "warn"
async_fn_in_trait = "allow"

[workspace.lints.clippy]
# Error handling - never leave unfinished implementation markers.
unwrap_used = "allow"
expect_used = "allow"
panic = "allow"
unimplemented = "deny"
todo = "deny"
exit = "deny"

# Code quality (all at lower priority to allow specific overrides)
all = { level = "warn", priority = -1 }

# Best practices
redundant_pattern_matching = "warn"
unnecessary_wraps = "allow"
too_many_arguments = "allow"
too_many_lines = "allow"
cognitive_complexity = "allow"
large_enum_variant = "allow"
derivable_impls = "allow"
type_complexity = "allow"
collapsible_if = "allow"
match_like_matches_macro = "allow"
manual_map = "allow"
manual_strip = "allow"
needless_question_mark = "allow"
assign_op_pattern = "allow"
should_implement_trait = "allow"
missing_panics_doc = "allow"
doc_markdown = "allow"
unwrap_or_default = "allow"
single_match = "allow"
useless_vec = "allow"
useless_format = "allow"
unnecessary_to_owned = "allow"
extend_with_drain = "allow"
io_other_error = "allow"
map_identity = "allow"
map_flatten = "allow"
manual_clamp = "allow"
needless_match = "allow"
iter_on_single_items = "allow"
new_without_default = "allow"
filter_map_identity = "allow"
doc_lazy_continuation = "allow"
for_kv_map = "allow"
unnecessary_map_or = "allow"

[[bench]]
name = "dispatch"
path = "benches/dispatch.rs"
harness = false

[[bench]]
name = "ocel_scale"
path = "benches/ocel_scale.rs"
harness = false

[[test]]
name = "cli_tests"
path = "tests/cli/mod.rs"

[[test]]
name = "frontier_tests"
path = "tests/frontier/mod.rs"
