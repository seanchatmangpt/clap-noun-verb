[workspace]
members = [".", "clap-noun-verb-macros", "utils"]
# Exclude standalone playground CLI (uses published crates.io version) and vendors directory
exclude = ["playground", "examples/playground", "examples/greet-demo", "vendors"]

[workspace.dependencies]
# CLI Framework
clap = { version = ">=4.5, <4.6", features = ["derive", "env", "suggestions"] }
clap-noun-verb = { path = ".", version = "26.9.1" }
clap-noun-verb-macros = { path = "clap-noun-verb-macros", version = "26.9.1" }

# Auto-discovery
linkme = "0.3"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Error handling
thiserror = "1.0"
# >=1.0.103 required: RUSTSEC advisory (Miri-detected UB in downcast_mut's
# retag) is fixed only from 1.0.103 onward. No Cargo.lock is committed (see
# .gitignore), so CI resolves dependencies fresh on every run -- pinning the
# minimum here, not just locally updating a lockfile, is what actually keeps
# CI off the vulnerable range.
anyhow = ">=1.0.103, <2.0"

# Utilities
once_cell = "1.19"

# Configuration formats
toml = "0.8"

# Async
tokio = { version = "1.40", features = ["full"] }

[package]
name = "clap-noun-verb"
version = "26.9.1"
edition = "2021"
rust-version = "1.74"
license = "MIT OR Apache-2.0"
authors = ["Sean Chatman <seanchatmangpt@gmail.com>"]
repository = "https://github.com/seanchatmangpt/clap-noun-verb"
documentation = "https://docs.rs/clap-noun-verb"
homepage = "https://github.com/seanchatmangpt/clap-noun-verb"
description = "Rust CLI framework with noun-verb patterns, graph operations, and capability packing"
keywords = ["cli", "clap", "noun-verb", "command-line", "typer"]
categories = ["command-line-utilities", "development-tools"]
readme = "README.md"

[lib]
name = "clap_noun_verb"
path = "src/lib.rs"

[[bin]]
name = "completions_demo"
path = "examples/howto/completions_demo.rs"

[[bin]]
name = "tutorial_basic"
path = "examples/tutorial/basic.rs"

[[bin]]
name = "clap-noun-verb-gen"
path = "src/bin/clap-noun-verb-gen.rs"

[features]
default = []

# Process data pipeline features (serde/serde_json already always present)
process-data = []

# Autonomic CI/CD policies
autonomic = ["process-data"]

# Contributor features
contrib = ["process-data"]

# Interactive REPL
repl = ["dep:rustyline", "dep:home"]

# OpenTelemetry instrumentation of the CLI dispatch path (registry run/route)
otel = [
    "dep:tracing",
    "dep:tracing-subscriber",
    "dep:tracing-opentelemetry",
    "dep:opentelemetry",
    "dep:opentelemetry_sdk",
]

# Federated capability network
federated-network = []

# Bounded frontier capabilities. These are real compile surfaces, not check-cfg placeholders.
meta-framework = []
rdf-composition = []
fractal-patterns = []
discovery-engine = []
learning-trajectories = []
reflexive-testing = []
economic-sim = []
quantum-ready = []
executable-specs = []
async = []

# Coherent capability families.
frontier-semantic = ["meta-framework", "rdf-composition", "fractal-patterns"]
frontier-intelligence = ["discovery-engine", "learning-trajectories", "economic-sim"]
frontier-quality = ["reflexive-testing", "quantum-ready", "executable-specs"]
frontier-all = [
    "frontier-semantic",
    "frontier-intelligence",
    "frontier-quality",
    "federated-network",
    "async",
]

# =============================================================================
# CORE DEPENDENCIES - Always required
# =============================================================================

[dependencies]
# CLI Framework
rustyline = { version = "14.0.0", optional = true }
# `rustyline` accepts compatible `home` 0.5.x releases. `home` 0.5.12 requires
# Rust 1.88 / Edition 2024, so bind the `repl` closure to the newest version
# compatible with this crate's declared Rust 1.74 MSRV.
home = { version = "=0.5.9", optional = true }
clap = { workspace = true }
clap-noun-verb-macros = { workspace = true }

# Auto-discovery
linkme = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }
jmespath = "0.3.0"

# Error handling
thiserror = { workspace = true }
anyhow = { workspace = true }

# Utilities
once_cell = { workspace = true }
lazy_static = "1.4"
# atty removed (RUSTSEC-2021-0145); use std::io::IsTerminal instead (stable since Rust 1.70)
tokio = { workspace = true }
parking_lot = "0.12"

# Configuration formats
serde_yaml = "0.9"
toml = { workspace = true }

# File watching
notify = "6.1"

# Validators
regex = "1.10"
url = "2.5"

# RDF/Ontology generators
chrono = "0.4"

# Logging facade (library code logs via log::*, never println!)
log = "0.4"

# OpenTelemetry instrumentation, optional behind `otel`
tracing = { version = "0.1", optional = true }
tracing-subscriber = { version = "0.3", optional = true }
tracing-opentelemetry = { version = "0.28", optional = true }
opentelemetry = { version = "0.27", optional = true }
opentelemetry_sdk = { version = "0.27", optional = true }

# =============================================================================
# DEV DEPENDENCIES - For tests, examples, and benchmarks
# =============================================================================

[dev-dependencies]
# Testing frameworks
# Transitive via criterion (rayon-core); pinned to a minimum here, not just
# via a locally-updated lockfile (none is committed -- see .gitignore), to
# keep CI's fresh dependency resolution off RUSTSEC-2026-0204 (invalid
# pointer dereference in fmt::Pointer for Atomic/Shared), fixed only from
# 0.9.20 onward.
crossbeam-epoch = ">=0.9.20, <0.10"
chicago-tdd-tools = { version = "1.0.0", features = ["testing-extras"] }
criterion = { version = "0.5", features = ["html_reports"] }
proptest = "1.0"
insta = { version = "1.0", features = ["json", "yaml"] }
loom = "0.7"

# CLI testing
assert_cmd = "2.0"
predicates = "3.0"
assert_fs = "1.0"

# Async testing
tokio-test = "0.4"
serial_test = "3.0"
tempfile = "3.8"

[workspace.metadata.make]
# Cargo-make configuration is consumed only by an externally installed cargo-make binary.
verbose = false

# =============================================================================
# TUTORIAL EXAMPLES - Learning-oriented, step-by-step guides
# =============================================================================

[[example]]
name = "tutorial_arguments"
path = "examples/tutorial/arguments.rs"

[[example]]
name = "tutorial_positional"
path = "examples/tutorial/positional.rs"

[[example]]
name = "tutorial_services"
path = "examples/tutorial/services.rs"

# =============================================================================
