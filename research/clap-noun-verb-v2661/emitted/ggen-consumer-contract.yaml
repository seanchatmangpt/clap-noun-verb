# =============================================================================
# API STABILITY COMMITMENTS
# =============================================================================

stability_matrix:
  macro_verb:
    current: "STABLE"
    breaking_risk: "HIGH (17 direct usages)"
    required_compatibility: "Must preserve #[verb] syntax and auto-discovery"

  macro_arg:
    current: "STABLE"
    breaking_risk: "MEDIUM (45 usages)"
    required_compatibility: "Must preserve #[arg(index = N)] syntax"

  error_nounverberror:
    current: "STABLE"
    breaking_risk: "MEDIUM"
    required_compatibility: "Must keep execution_error() and ExecutionError variant"

  result_type:
    current: "STABLE"
    breaking_risk: "CRITICAL"
    required_compatibility: "Type alias must remain compatible"

  output_format:
    current: "STABLE"
    breaking_risk: "HIGH"
    required_compatibility: "All enum variants must remain, from_str() must work"

  format_output:
    current: "STABLE"
    breaking_risk: "MEDIUM"
    required_compatibility: "Function signature must remain compatible"

  run_function:
    current: "STABLE"
    breaking_risk: "CRITICAL"
    required_compatibility: "No-arg entry point is foundational"

# =============================================================================
# BREAKING CHANGE RISK ANALYSIS
# =============================================================================

breaking_change_risks:
  - change: "Removing #[verb] or changing macro syntax"
    impact: "17 commands + tests fail to compile"
    severity: "CRITICAL"
    likelihood: "LOW (core API)"

  - change: "Changing OutputFormat enum variants"
    impact: "Pattern matching breaks in format parsing"
    severity: "HIGH"
    likelihood: "LOW (stable interface)"

  - change: "Removing NounVerbError::execution_error()"
    impact: "Error wrapping patterns break"
    severity: "MEDIUM"
    likelihood: "VERY LOW"

  - change: "Renaming Result type or changing error type"
    impact: "All 17+ commands fail to compile"
    severity: "CRITICAL"
    likelihood: "VERY LOW"

  - change: "Removing run() function"
    impact: "main.rs cannot call clap_noun_verb::run()"
    severity: "CRITICAL"
    likelihood: "VERY LOW"

  - change: "Changing format_output() signature"
    impact: "format_output(&data, fmt)? pattern breaks"
    severity: "HIGH"
    likelihood: "VERY LOW"

# =============================================================================
# SAFE CHANGES (Can be made without affecting ggen)
# =============================================================================

safe_changes:
  - "Internal error type implementation (as long as public API unchanged)"
  - "Registry mechanics and discovery algorithm (as long as #[verb] works)"
  - "Output formatter implementations (JSON, YAML, Table backends)"
  - "Performance optimizations in format_output()"
  - "Adding new OutputFormat variants (backward compatible)"
  - "Adding new helper methods to NounVerbError (as long as existing ones stay)"
  - "Internal refactoring of registry code"

# =============================================================================
# RECOMMENDATIONS
# =============================================================================

recommendations:
  - priority: "CRITICAL"
    item: "Preserve all 7 core APIs: verb, arg, Result, NounVerbError, OutputFormat, format_output, run()"
    rationale: "ggen depends on these 100% for functionality"

  - priority: "HIGH"
    item: "Document macro attribute syntax stability"
    rationale: "17 verbs rely on exact syntax"

  - priority: "HIGH"
    item: "Maintain OutputFormat::from_str() capability"
    rationale: "Used in config.rs for format selection"

  - priority: "MEDIUM"
    item: "Add deprecation warnings for doc-comment arg syntax (if deprecated)"
    rationale: "ggen uses inline #[arg(...)] exclusively, but warn users of other patterns"

  - priority: "MEDIUM"
    item: "Provide migration guide if major version bumps any APIs"
    rationale: "17 commands + tests would need updates"

# =============================================================================
# MIGRATION PATH (if v26.6.1 → v27.0.0 required)
# =============================================================================

migration_requirements:
  - estimate_effort: "LOW (< 1 hour)"
    reason: "No custom registry code, all API usage straightforward"
    assumption: "APIs remain named/shaped the same"

  - breaking_changes_handled:
    - "#[verb] syntax change → Update all 17 command handlers"
    - "Result type rename → Update all return types"
    - "NounVerbError constructor change → Update error wrapping"
    - "OutputFormat enum restructure → Update format parsing"

# =============================================================================
