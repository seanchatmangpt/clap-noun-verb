---
# ggen Consumer Contract for clap-noun-verb v26.6.1
# Generated: 2026-06-01
# Consumer Project: mcpp-cli (ggen CLI implementation)

contract_version: "1.0"
consumer_name: "mcpp-cli (ggen playground)"
framework_name: "clap-noun-verb"
framework_version: "26.6.1"
analysis_date: "2026-06-01"

# =============================================================================
# MACRO API CONTRACT
# =============================================================================

macros:
  verb:
    stability: "REQUIRED_STABLE"
    usage_count: 17
    pattern: "#[verb(\"action\")]"
    attributes:
      - name: "action_name"
        type: "string"
        description: "Subcommand name (e.g., 'add', 'remove', 'list')"
        required: true
    signature_examples:
      - "fn handler(arg1: String) -> Result<()>"
      - "fn handler(arg1: String, opt: Option<String>) -> Result<OutputType>"
    locations:
      - "src/commands/config.rs:31,74,111"
      - "src/commands/pack.rs:12,34,51,67,84,101,113"
      - "src/commands/receipt.rs:18,61,117,170"
      - "src/commands/capability.rs:multiple"
      - "src/commands/meta.rs:multiple"
      - "src/commands/papers.rs:multiple"
      - "src/commands/policy.rs:multiple"
      - "src/commands/sync.rs:multiple"
      - "src/commands/telco.rs:multiple"
      - "src/commands/wizard.rs:multiple"
      - "src/commands/ontology.rs:1"
      - "src/commands/spec.rs:1"
      - "src/commands/registry.rs:1"
      - "src/commands/accept.rs:1"
      - "src/commands/thesis.rs:1"
      - "src/commands/powl8.rs:1"
    note: "Requires linkme distributed slice auto-discovery"

  arg:
    stability: "REQUIRED_STABLE"
    usage_count: 45
    pattern: "#[arg(index = N)]"
    attributes:
      - name: "index"
        type: "usize"
        description: "Positional argument index (1-based)"
        required: true
    examples:
      - "#[arg(index = 1)] key: String"
      - "#[arg(index = 2)] value: String"
      - "#[arg(index = 3)] format: Option<String>"
    note: "Used for positional arguments in verb handlers"

# =============================================================================
# RUNTIME API CONTRACT
# =============================================================================

runtime_api:
  error_type:
    name: "NounVerbError"
    stability: "REQUIRED_STABLE"
    methods:
      - name: "execution_error"
        signature: "fn(message: impl Into<String>) -> Self"
        usage: "config.rs:52, pack.rs:19"
        return_type: "NounVerbError"
      - name: "ExecutionError variant"
        signature: "NounVerbError::ExecutionError { message: String }"
        usage: "pack.rs:19"
    examples:
      - "clap_noun_verb::NounVerbError::execution_error(e.to_string())"
      - "NounVerbError::ExecutionError { message: e }"

  result_type:
    name: "clap_noun_verb::Result<T>"
    stability: "REQUIRED_STABLE"
    definition: "type Result<T> = std::result::Result<T, NounVerbError>"
    return_patterns:
      - return_type: "Result<()>"
        usage_count: 8
        examples:
          - "set_config() -> Result<()>"
          - "receipt_emit() -> Result<()>"
        semantics: "Command with side effects, no structured output"
      - return_type: "Result<StructuredType>"
        usage_count: 9
        examples:
          - "add_pack(...) -> Result<PackAddedOutput>"
          - "list_packs() -> Result<PackListOutput>"
        semantics: "Command returning serializable data"
      - return_type: "Result<serde_json::Value>"
        usage_count: 3
        examples:
          - "receipt_emit(...) -> Result<serde_json::Value>"
        semantics: "Dynamic JSON output"

  output_format:
    name: "OutputFormat"
    stability: "REQUIRED_STABLE"
    enum_variants:
      - "Json"
      - "JsonPretty (default)"
      - "Yaml"
      - "Table"
      - "Plain"
      - "Tsv"
      - "Quiet"
    usage_pattern: "OutputFormat::from_str(s).ok() or OutputFormat::JsonPretty"
    locations:
      - "config.rs:40-60"
      - "meta.rs:introspection"
      - "papers.rs:output"

  format_function:
    name: "format_output"
    stability: "REQUIRED_STABLE"
    signature: "fn<S: Serialize>(value: &S, fmt: OutputFormat) -> Result<String>"
    usage_pattern: "format_output(&output_struct, fmt)?"
    locations:
      - "config.rs:53,91,134"
      - "papers.rs:multiple"
    note: "Auto-serializes Serialize types to selected format"

  run_function:
    name: "run"
    stability: "REQUIRED_STABLE"
    signature: "pub fn run() -> Result<()>"
    usage: "main.rs:39"
    behavior: "Auto-discovers all #[verb] commands and executes CLI"

  argmatches_reexport:
    name: "clap::ArgMatches"
    stability: "REQUIRED_STABLE"
    usage: "Imported via pub use clap::ArgMatches"
    consumer_usage:
      - "config_loader.rs:49 - Creating empty ArgMatches for adapter"
      - "LayeredConfigAdapter integration pattern"
    note: "Used for advanced integration patterns"

# =============================================================================
# MACRO CRATE CONTRACT
# =============================================================================

macro_crate:
  name: "clap-noun-verb-macros"
  exports:
    - "verb"
    - "arg"
  proc_macro_rules:
    - input_pattern: "function + attributes"
      output_pattern: "linkme distributed slice entry + clap Command registration"

# =============================================================================
# FEATURE USAGE
# =============================================================================

features:
  default_features:
    - "Error handling (NounVerbError)"
    - "Output formatting (OutputFormat)"
    - "Registry/auto-discovery (linkme)"
  features_not_used:
    - "async"
    - "io"
    - "crypto"
    - "rdf"
    - "kernel"
  implicit_usage:
    - "serde::Serialize (all return types)"
    - "std::str::FromStr (OutputFormat parsing)"

# =============================================================================
# INTEGRATION PATTERNS
# =============================================================================

integration_patterns:
  - name: "layered_config_integration"
    file: "config.rs"
    usage: "LayeredConfigAdapter<Config>::new() + ArgMatches::default()"
    requirement: "ArgMatches::default() constructor"

  - name: "error_wrapping"
    files:
      - "config.rs:52"
      - "pack.rs:19"
    requirement: "NounVerbError::execution_error() constructor"

  - name: "output_format_parsing"
    files:
      - "config.rs:40-60"
      - "papers.rs"
    requirement: "OutputFormat::from_str()"

  - name: "auto_discovery_init"
    file: "src/lib.rs:16"
    usage: "mcpp_cli::init() forces linker to include all #[verb] entries"
    requirement: "linkme integration"

