[config]
skip_core_tasks = false
default_to_workspace = false

# This file is a local projection of the evidence ladder, not a second CI control plane.
# GitHub verification authority lives in .github/workflows/verify.yml.
# No task in this file publishes, deploys, pushes, creates releases, or otherwise actuates.

[tasks.default]
dependencies = ["verify-fast"]
description = "Run the cheapest high-information local verifier"

[tasks.format]
command = "cargo"
args = ["fmt", "--all"]
description = "Apply rustfmt locally; CI only verifies formatting"

[tasks.format-check]
command = "cargo"
args = ["fmt", "--all", "--", "--check"]
description = "Refuse formatting drift"

[tasks.verify-no-wip]
command = "python3"
args = ["scripts/verify_no_wip.py"]
description = "Refuse unfinished admitted implementation surfaces"

[tasks.clippy]
command = "cargo"
args = ["clippy", "--workspace", "--all-targets", "--all-features", "--", "-D", "warnings"]
description = "Compile and lint the maximal feature surface"

[tasks.check-baseline]
command = "cargo"
args = ["check", "-p", "clap-noun-verb", "--all-targets", "--no-default-features"]
description = "Compile the baseline surface without optional features"

[tasks.check-features]
script_runner = "@shell"
description = "Derive every declared Cargo feature from Cargo.toml and compile it once"
script = '''
set -eu
cargo check -p clap-noun-verb --all-targets --no-default-features
python3 - <<'PY'
import subprocess, tomllib
with open("Cargo.toml", "rb") as source:
    features = sorted(tomllib.load(source)["features"])
for feature in features:
    print(f"feature={feature}", flush=True)
    subprocess.run([
        "cargo", "check", "-p", "clap-noun-verb", "--all-targets",
        "--no-default-features", "--features", feature,
    ], check=True)
print(f"compiled_features={len(features)}")
PY
cargo check --workspace --all-targets --all-features
'''

[tasks.test-lib]
command = "cargo"
args = ["test", "-p", "clap-noun-verb", "--lib", "--all-features"]
description = "Load-bearing distributed-registry unit proof"

[tasks.test-all]
command = "cargo"
args = ["test", "--workspace", "--all-features"]
description = "Complete workspace behavior proof"

[tasks.witness-replay]
script_runner = "@shell"
description = "Execute repository witnesses twice and require deterministic replay"
script = '''
set -eu
mkdir -p target/verify/witnesses
bash scripts/run_witnesses.sh target/verify/witnesses/first.txt
bash scripts/run_witnesses.sh target/verify/witnesses/second.txt
cmp target/verify/witnesses/first.txt target/verify/witnesses/second.txt
sha256sum target/verify/witnesses/first.txt target/verify/witnesses/second.txt
'''

[tasks.doc]
command = "cargo"
args = ["doc", "--workspace", "--all-features", "--no-deps"]
env = { RUSTDOCFLAGS = "-D warnings" }
description = "Build the public API with warnings refused"

[tasks.bench-build]
command = "cargo"
args = ["bench", "-p", "clap-noun-verb", "--bench", "dispatch", "--all-features", "--no-run"]
description = "Compile the benchmark surface without substituting synthetic performance claims"

[tasks.supply-chain]
command = "cargo"
args = ["deny", "check", "advisories", "bans", "licenses", "sources", "--deny", "warnings"]
description = "Run one consolidated supply-chain admission gate"

[tasks.msrv]
script_runner = "@shell"
description = "Compile both crates on the declared Rust 1.74 MSRV"
script = '''
set -eu
rustup toolchain install 1.74.0 --profile minimal --no-self-update
cargo +1.74.0 check -p clap-noun-verb -p clap-noun-verb-macros --all-features
'''

[tasks.build-release]
command = "cargo"
args = ["build", "--workspace", "--all-features", "--release"]
description = "Manufacture release-mode binaries locally without publishing"

[tasks.verify-fast]
dependencies = ["verify-no-wip", "format-check", "clippy", "test-lib"]
description = "80/20 local verifier: unfinished-work refusal, format, maximal lint/compile, registry proof"

[tasks.verify]
dependencies = [
    "verify-no-wip",
    "format-check",
    "clippy",
    "check-features",
    "test-lib",
    "test-all",
    "witness-replay",
    "doc",
    "bench-build",
]
description = "Complete local evidence ladder before external semantic/receipt verification"

[tasks.release-admission]
dependencies = ["verify", "supply-chain", "msrv", "build-release"]
description = "Admission-only release gate; actual release DO must re-enter BRCE and emit its own receipt"
