[package]
name = "cargo-cicd"
version = "26.6.1"
edition = "2021"
rust-version = "1.74"
license = "MIT OR Apache-2.0"
authors = ["Sean Chatman <seanchatmangpt@gmail.com>"]
description = "Cargo CI/CD toolkit: target inspection, test selection, and trybuild fixture management"

[[bin]]
name = "cargo-cicd"
path = "src/main.rs"

[dependencies]
clap-noun-verb = { path = "../..", version = "26.6.1" }
clap = { version = "4.5", features = ["derive", "env", "suggestions"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
anyhow = "1.0"
thiserror = "1.0"
tokio = { version = "1.40", features = ["full"] }
log = "0.4"
chrono = { version = "0.4", features = ["serde"] }

# For cargo metadata inspection
cargo_metadata = "0.18"

# For git operations
git2 = { version = "0.21", optional = true }

[features]
default = []
git = ["git2"]
