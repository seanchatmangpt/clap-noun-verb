[package]
name = "clap-noun-verb-macros"
version = "26.9.1"
edition = "2021"
license = "MIT"
description = "Procedural macros for clap-noun-verb"
repository = "https://github.com/seanchatmangpt/clap-noun-verb"

[lib]
proc-macro = true

[dependencies]
syn = { version = "2.0", features = ["full", "parsing"] }
quote = "1.0"
proc-macro2 = "1.0"
linkme = { workspace = true }

[lints]
workspace = true
