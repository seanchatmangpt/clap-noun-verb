[package]
name = "speckit-ralph"
version = "0.1.0"
edition = "2021"
authors = ["Sean Chatman <seanchatmangpt@gmail.com>"]

[dependencies]
clap-noun-verb = { path = ".." }
clap-noun-verb-macros = { path = "../clap-noun-verb-macros" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.40", features = ["full"] }
anyhow = "1.0"
thiserror = "1.0"
linkme = "0.3"

