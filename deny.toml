# cargo-deny configuration
# https://github.com/EmbarkStudios/cargo-deny

[advisories]
# advisories checks are enabled by default. Ignore lists can be added below.
ignore = []

[licenses]
unused-allowed-license = "allow"
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "CC0-1.0",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow = []
skip = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = [
    "sparse+https://index.crates.io/",
    "https://github.com/rust-lang/crates.io-index",
]
allow-git = []
