# Executable consumer proof for the clap-noun-verb pack.
#
# The ontology owns the CLI interface. Generated wrappers delegate through the
# stable consumer-owned handler seam. ggen receipt/replay and byte-identical
# second manufacture are enforced by .github/workflows/ggen-authority.yml.

[project]
name = "greet-demo"
version = "0.1.0"
description = "Executable proof that admitted RDF manufactures a working clap-noun-verb CLI with receipted, replayable generated interfaces."

[ontology]
source = "ontology.ttl"
base_iri = "http://clap-noun-verb.io/examples/greet-demo#"

[ontology.prefixes]
cnv = "http://clap-noun-verb.io/ontology#"
ex = "http://clap-noun-verb.io/examples/greet-demo#"
rdf = "http://www.w3.org/1999/02/22-rdf-syntax-ns#"
rdfs = "http://www.w3.org/2000/01/rdf-schema#"
xsd = "http://www.w3.org/2001/XMLSchema#"

[inference]
[[inference.rules]]
name = "attach-noun-name-to-verb"
construct = """
PREFIX cnv: <http://clap-noun-verb.io/ontology#>
CONSTRUCT {
  ?verb cnv:belongsToNoun ?noun .
} WHERE {
  ?noun a cnv:Noun ; cnv:hasVerbs ?verb .
}
"""

[generation]
output_dir = "."

[[generation.rules]]
name = "verb-wrappers"
query = { file = "../../queries/verb-signatures.rq" }
template = { file = "../../templates/verb.rs.tera" }
output_file = "src/verbs/{{ verb_name }}.rs"
mode = "Overwrite"
skip_empty = true

[[generation.rules]]
name = "verbs-mod"
query = { file = "../../queries/verbs-mod.rq" }
template = { file = "../../templates/verbs-mod.rs.tera" }
output_file = "src/verbs/mod.rs"
mode = "Overwrite"
skip_empty = true

# Current ggen gate polarity: ASK true means a violation exists. Full IRIs are
# used because custom rule ASKs do not inherit manifest prefixes.
[[validation.rules]]
name = "cnv-fieldname-collision"
description = "Refuse two distinct arguments on one verb whose resolved Rust field names collide. ASK true is a violation; ASK false admits generation."
severity = "Error"
ask = """
ASK {
  ?verb <http://www.w3.org/1999/02/22-rdf-syntax-ns#type>
          <http://clap-noun-verb.io/ontology#Verb> ;
        <http://clap-noun-verb.io/ontology#hasArguments> ?argA ;
        <http://clap-noun-verb.io/ontology#hasArguments> ?argB .
  FILTER( STR(?argA) < STR(?argB) )
  ?argA <http://clap-noun-verb.io/ontology#hasArgumentName> ?flagA .
  ?argB <http://clap-noun-verb.io/ontology#hasArgumentName> ?flagB .
  OPTIONAL { ?argA <http://clap-noun-verb.io/ontology#fieldName> ?explicitA }
  OPTIONAL { ?argB <http://clap-noun-verb.io/ontology#fieldName> ?explicitB }
  BIND( COALESCE( ?explicitA, REPLACE(STR(?flagA), "-", "_") ) AS ?fieldA )
  BIND( COALESCE( ?explicitB, REPLACE(STR(?flagB), "-", "_") ) AS ?fieldB )
  FILTER( ?fieldA = ?fieldB )
}
"""
