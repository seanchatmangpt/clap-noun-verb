[workspace]

[package]
name = "specimen-graph-manager"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "specimen-graph-manager"
path = "src/main.rs"

[dependencies]
# Core CLI framework v26.6.1
clap-noun-verb = { path = "../..", version = "26.6.1" }
clap-noun-verb-macros = { path = "../../clap-noun-verb-macros", version = "26.6.1" }

# Auto-discovery (required for #[verb] macro)
linkme = "0.3"

# Serialization (required for output types)
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Standard utilities
once_cell = "1.0"
lazy_static = "1.4"

# Validation and regex (for validators)
regex = "1.0"
url = "2.0"

[dev-dependencies]
tempfile = "3.0"
